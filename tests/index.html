<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engine Tests | Kilopixel</title>
  <link rel="stylesheet" href="../docs/css/docs.css">
  <style>
    .test-summary { font-weight: 700; margin: 16px 0; }
    .test-pass { color: #15803d; }
    .test-fail { color: #b91c1c; }
    .test-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .test-table td { border-bottom: 1px solid #e2e8f0; padding: 6px 8px; vertical-align: top; }
    .test-stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 24px; }
    .test-stages pxl-stage { border: 1px solid #e2e8f0; }
  </style>
  <!-- The built bundle: run `node build.js` before opening this page -->
  <script src="../dist/pxl.min.js"></script>
</head>
<body>
  <main class="docs-content">
    <div class="docs-inner">
      <h1>Engine Tests</h1>
      <p>Open after every engine change (after <code>node build.js</code>), via the dev server: <code>http://localhost:8124/tests/</code>. All tests run automatically; the result is also shown in the tab title (<code>Tests: N/N passed</code>) and stored in <code>window.kilopixelTests</code>. Add a test for every engine fix.</p>

      <p id="summary" class="test-summary">Running…</p>
      <table class="test-table"><tbody id="results"></tbody></table>

      <!-- ================================================================= -->
      <!-- TEST STAGES                                                       -->
      <!-- Every stage uses alwaysrender, so tests also run when off-screen. -->
      <!-- ================================================================= -->
      <div class="test-stages">

        <!-- toLocal: reader inside a rotating, scaled layer (design/2026-10-26_tolocal_fix_plan.md) -->
        <pxl-stage id="tlStage1" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-circle id="tlSun1" x="150" y="150" r="18" fill="#fb923c"></pxl-circle>
          </pxl-layer>
          <pxl-layer x="600" y="350" rotate="t * 12" zoom="1.5">
            <pxl-circle id="tlReader1" x="toLocal(ref.tlSun1, 'x')" y="toLocal(ref.tlSun1, 'y')" r="16" stroke="#1d4ed8" strokewidth="3"></pxl-circle>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal: static move of the reader's layer (setAttribute), then idle -->
        <pxl-stage id="tlStage2" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-circle id="tlSun2" x="150" y="150" r="18" fill="#fb923c"></pxl-circle>
          </pxl-layer>
          <pxl-layer id="tlLayer2" x="600" y="350">
            <pxl-circle id="tlReader2" x="toLocal(ref.tlSun2, 'x')" y="toLocal(ref.tlSun2, 'y')" r="16" stroke="#1d4ed8" strokewidth="3"></pxl-circle>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal: nested group, pxl-var and polyline point readers -->
        <pxl-stage id="tlStage3" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-circle id="tlSun3" x="200" y="150" r="18" fill="#fb923c"></pxl-circle>
          </pxl-layer>
          <pxl-layer x="600" y="350" rotate="t * 12" zoom="1.2">
            <pxl-var id="tlVar3" value="toLocal(ref.tlSun3, 'x')"></pxl-var>
            <pxl-group x="50" y="20" rotate="-t * 30" zoom="0.8">
              <pxl-circle id="tlReader3" x="toLocal(ref.tlSun3, 'x')" y="toLocal(ref.tlSun3, 'y')" r="16" stroke="#1d4ed8" strokewidth="3"></pxl-circle>
              <pxl-polyline id="tlPoly3" points="0,0; toLocal(ref.tlSun3, 'x'), toLocal(ref.tlSun3, 'y')" stroke="#22c55e" strokewidth="3"></pxl-polyline>
            </pxl-group>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal: reader and target in the same moving subtree -->
        <pxl-stage id="tlStage4" ratio="5 / 3" alwaysrender>
          <pxl-layer x="500" y="300" rotate="t * 15">
            <pxl-circle id="tlTarget4" x="200" dx="60" rotate="t * 40" r="18" fill="#fb923c"></pxl-circle>
            <pxl-group x="-150" rotate="t * -25">
              <pxl-circle id="tlReader4" x="toLocal(ref.tlTarget4, 'tx')" y="toLocal(ref.tlTarget4, 'ty')" r="16" stroke="#1d4ed8" strokewidth="3"></pxl-circle>
            </pxl-group>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal: line connecting two circles in other layers (walkthrough §8 case) -->
        <pxl-stage id="tlStage5" ratio="5 / 3" alwaysrender>
          <pxl-layer id="tlLayer5a" x="350" y="250">
            <pxl-circle id="tlCircle5a" x="-150" y="-150" r="40" stroke="#f97316" strokewidth="4"></pxl-circle>
          </pxl-layer>
          <pxl-layer id="tlLayer5b" x="650" y="350">
            <pxl-circle id="tlCircle5b" x="150" y="150" r="40" stroke="#3b82f6" strokewidth="4"></pxl-circle>
          </pxl-layer>
          <pxl-layer id="tlLayer5c">
            <pxl-line id="tlLine5"
              x1="toLocal(ref.tlCircle5a, 'x')" y1="toLocal(ref.tlCircle5a, 'y')"
              x2="toLocal(ref.tlCircle5b, 'x')" y2="toLocal(ref.tlCircle5b, 'y')"
              stroke="#ec4899" strokewidth="4" linedash="[10, 8]">
            </pxl-line>
          </pxl-layer>
        </pxl-stage>

        <!-- ref.<id>.tx / ty: drawn origin in the same space, after the element's own rotate / scale / skew -->
        <pxl-stage id="txStage" ratio="5 / 3" alwaysrender>
          <pxl-layer x="100" y="50">
            <pxl-rect id="txBox" x="300" y="150" dx="150" rotate="90" w="80" h="80" stroke="#f97316" strokewidth="4"></pxl-rect>
            <pxl-circle id="txReader" x="ref.txBox.tx" y="ref.txBox.ty" r="10" fill="#c2410c"></pxl-circle>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal decomposition and zoom (design/2026-10-29_tolocal_decomposition_plan.md) -->
        <pxl-stage id="dcStage" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-circle id="dcReader" r="1"></pxl-circle>
            <pxl-group x="200" y="100" scalex="-1">
              <pxl-circle id="dcMirror" r="10" fill="#fb923c"></pxl-circle>
            </pxl-group>
            <pxl-rect id="dcSkew" x="400" y="100" skewx="30" w="60" h="40" stroke="#3b82f6"></pxl-rect>
            <pxl-group x="700" y="100" scalex="2" scaley="0.5">
              <pxl-circle id="dcStretched" r="10" fill="#22c55e"></pxl-circle>
            </pxl-group>
            <pxl-rect id="dcZoomRect" x="100" y="450" zoom="2" scalex="1.5" w="20" h="20" stroke="#8b5cf6"></pxl-rect>
          </pxl-layer>
          <pxl-layer x="250" y="300" rotate="30" zoom="1.5">
            <pxl-circle id="dcUniform" r="10" fill="#fb923c"></pxl-circle>
            <pxl-circle id="dcZoomed" x="40" zoom="2" r="6" fill="#3b82f6"></pxl-circle>
          </pxl-layer>
          <!-- Clone rule: the outline copies the part's frame from another space -->
          <pxl-layer x="650" y="350" rotate="t * 12">
            <pxl-group scalex="2">
              <pxl-rect id="dcPart" x="60" rotate="40" dx="30" w="50" h="25" fill="#22c55e"></pxl-rect>
            </pxl-group>
          </pxl-layer>
          <pxl-layer>
            <pxl-rect id="dcClone" x="toLocal(ref.dcPart, 'x')" y="toLocal(ref.dcPart, 'y')"
              rotate="toLocal(ref.dcPart, 'rotate')" skewx="toLocal(ref.dcPart, 'skewx')"
              scalex="toLocal(ref.dcPart, 'scalex')" scaley="toLocal(ref.dcPart, 'scaley')"
              dx="ref.dcPart.dx" dy="ref.dcPart.dy" w="50" h="25" stroke="#0f172a" strokewidth="2"></pxl-rect>
          </pxl-layer>
        </pxl-stage>

        <!-- Engine cleanup fixes (design/2026-10-27_engine_cleanup_inventory_note.md §3 A) -->
        <pxl-stage id="ecStage" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-var id="ecVar" value="0"></pxl-var>
            <pxl-grid id="ecGrid" step="100" stroke="#e2e8f0"></pxl-grid>
            <pxl-group id="ecGroupA" x="100">
              <pxl-circle id="ecMover" x="20" y="100" r="12" fill="#fb923c"></pxl-circle>
            </pxl-group>
            <pxl-group id="ecGroupB" x="300"></pxl-group>
            <pxl-circle id="ecTarget" x="640" y="120" r="12" fill="#3b82f6"></pxl-circle>
            <pxl-rect id="ecButton" x="200" y="400" w="80" h="40" fill="#22c55e"
              onclick="ref.ecVar.set('value', toLocal(ref.ecTarget, 'x'))"></pxl-rect>
            <pxl-polyline id="ecPoly" points="100,500; 300,550" stroke="#ec4899" strokewidth="3"></pxl-polyline>
          </pxl-layer>
        </pxl-stage>

      </div>
    </div>
  </main>

  <script>
    // --- Minimal test runner (no dependencies) ---
    const tests = [];
    const test = (name, fn) => tests.push({ name, fn });
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const el = (id) => pxl.nodes[id].$node;
    const round = (n) => Math.round(n * 10) / 10;

    // Stored attribute values of `reader` must equal a fresh toLocal() of `target`
    function expectMapped(readerId, targetId, pairs) {
      const reader = el(readerId), target = pxl.nodes[targetId];
      for (const [attr, prop] of pairs) {
        const stored = reader.attributeValues[attr];
        const fresh = pxl.toLocal(reader, target, prop);
        if (!(Math.abs(stored - fresh) < 0.01)) {
          throw new Error(`${readerId}.${attr} is ${round(stored)}, toLocal(${targetId}, '${prop}') is ${round(fresh)}`);
        }
      }
    }
    const XY = [['x', 'x'], ['y', 'y']];

    // Runs `check` several times while the stages animate
    async function sampled(check, times = 3, gap = 300) {
      for (let i = 0; i < times; i++) {
        await wait(gap);
        check();
      }
    }

    // ===================================================================
    // toLocal (design/2026-10-26_tolocal_fix_plan.md)
    // ===================================================================

    test('toLocal: reader in a rotating, scaled layer follows a still target', () =>
      sampled(() => expectMapped('tlReader1', 'tlSun1', XY)));

    test('toLocal: static move of the reader\'s layer updates the reader', async () => {
      expectMapped('tlReader2', 'tlSun2', XY);
      const layer = el('tlLayer2');
      layer.setAttribute('x', '450');
      layer.setAttribute('rotate', '35');
      layer.setAttribute('zoom', '1.4');
      await wait(100);
      expectMapped('tlReader2', 'tlSun2', XY);
    });

    test('toLocal: nothing redraws while nothing moves (stage idle at 0 FPS)', async () => {
      await wait(2200); // fps is published once per second
      const fps = pxl.nodes.tlStage2.fps;
      if (fps !== 0) throw new Error(`static stage renders at ${fps} FPS`);
    });

    test('toLocal: reader in a nested group inside a rotating layer', () =>
      sampled(() => expectMapped('tlReader3', 'tlSun3', XY)));

    test('toLocal: <pxl-var> reader inside a rotating layer', () =>
      sampled(() => expectMapped('tlVar3', 'tlSun3', [['value', 'x']])));

    test('toLocal: polyline point reader inside a rotating layer', () =>
      sampled(() => expectMapped('tlPoly3', 'tlSun3', [['p2', 'x'], ['p3', 'y']])));

    test('toLocal: reader and target in the same moving subtree', () =>
      sampled(() => expectMapped('tlReader4', 'tlTarget4', [['x', 'tx'], ['y', 'ty']])));

    test('toLocal: line follows when its own layer moves (walkthrough §8 case)', async () => {
      const ends = (a, b) => { expectMapped('tlLine5', a, [['x1', 'x'], ['y1', 'y']]); expectMapped('tlLine5', b, [['x2', 'x'], ['y2', 'y']]); };
      ends('tlCircle5a', 'tlCircle5b');
      const layer = el('tlLayer5c');
      layer.setAttribute('x', '500');
      layer.setAttribute('y', '300');
      layer.setAttribute('rotate', '30');
      await wait(100);
      ends('tlCircle5a', 'tlCircle5b');
    });

    test('toLocal: line follows when a target\'s layer moves (target side)', async () => {
      el('tlLayer5b').setAttribute('rotate', '45');
      el('tlLayer5a').setAttribute('zoom', '0.7');
      await wait(100);
      expectMapped('tlLine5', 'tlCircle5a', [['x1', 'x'], ['y1', 'y']]);
      expectMapped('tlLine5', 'tlCircle5b', [['x2', 'x'], ['y2', 'y']]);
    });

    test('toLocal: replacing a toLocal attribute with a number removes it from toLocalAttributeKeys', async () => {
      const reader = el('tlReader2');
      if (!reader.toLocalAttributeKeys.includes('x')) throw new Error('x missing before the change');
      reader.setAttribute('x', '10');
      if (reader.toLocalAttributeKeys.includes('x')) throw new Error('x still listed after setAttribute(\'x\', \'10\')');
      reader.setAttribute('x', "toLocal(ref.tlSun2, 'x')");
      if (!reader.toLocalAttributeKeys.includes('x')) throw new Error('x not listed again after restoring toLocal');
    });

    // ===================================================================
    // ref.<id>.tx / ty
    // ===================================================================

    test('ref.tx: includes the element\'s own rotate (x=300, dx=150, rotate=90 → 300, 300)', () => {
      const { tx, ty } = pxl.nodes.txBox;
      if (Math.abs(tx - 300) > 0.01 || Math.abs(ty - 300) > 0.01) throw new Error(`tx, ty is ${round(tx)}, ${round(ty)}`);
    });

    test('ref.tx: same-space reader follows rotate / scale / skew changes and equals toLocal(…, \'tx\')', async () => {
      expectMapped('txReader', 'txBox', [['x', 'tx'], ['y', 'ty']]);
      const box = el('txBox');
      box.setAttribute('rotate', '35');
      box.setAttribute('scalex', '1.5');
      box.setAttribute('skewx', '20');
      box.setAttribute('dy', '40');
      await wait(100);
      expectMapped('txReader', 'txBox', [['x', 'tx'], ['y', 'ty']]);
    });

    // ===================================================================
    // toLocal decomposition and zoom (design/2026-10-29_tolocal_decomposition_plan.md)
    // ===================================================================

    // toLocal() of `targetId` as seen from dcReader (untransformed layer), compared with `expected`
    function expectFrame(targetId, expected) {
      for (const prop in expected) {
        const value = pxl.toLocal(el('dcReader'), pxl.nodes[targetId], prop);
        if (!(Math.abs(value - expected[prop]) < 0.01)) {
          throw new Error(`toLocal(${targetId}, '${prop}') is ${round(value)}, expected ${expected[prop]}`);
        }
      }
    }

    test('toLocal decomposition: a mirrored target rebuilds as a mirror, not a 180° turn', () =>
      expectFrame('dcMirror', { rotate: 180, scalex: 1, scaley: -1, skewx: 0, zoom: 1 }));

    test('toLocal decomposition: skewx="30" comes back as skewx 30', () =>
      expectFrame('dcSkew', { rotate: 0, scalex: 1, scaley: 1, skewx: 30, zoom: 1 }));

    test('toLocal decomposition: uniform layer (rotate 30, zoom 1.5) gives zoom = scalex = scaley', () =>
      expectFrame('dcUniform', { rotate: 30, scalex: 1.5, scaley: 1.5, skewx: 0, zoom: 1.5 }));

    test('toLocal zoom: zoom 2 in a layer with zoom 1.5 is 3, also with skew; a stretched group gives the area factor', async () => {
      expectFrame('dcZoomed', { zoom: 3 });
      el('dcZoomed').setAttribute('skewx', '30');
      await wait(50);
      expectFrame('dcZoomed', { zoom: 3 });
      expectFrame('dcStretched', { scalex: 2, scaley: 0.5, zoom: 1 });
    });

    test('toLocal clone rule: the outline\'s global matrix equals the part\'s while the layer turns', () =>
      sampled(() => {
        const part = el('dcPart').getGlobalMatrix(), clone = el('dcClone').getGlobalMatrix();
        for (let i = 0; i < 6; i++) {
          if (!(Math.abs(part[i] - clone[i]) < 0.01)) {
            throw new Error(`matrix entry ${i}: part ${round(part[i])}, clone ${round(clone[i])}`);
          }
        }
      }));

    test('zoom multiplies scalex / scaley: zoom 2 and scalex 1.5 give 3 / 2', () => {
      const m = el('dcZoomRect').getLocalMatrix();
      if (round(m[0]) !== 3 || round(m[3]) !== 2) throw new Error(`scale is ${round(m[0])} / ${round(m[3])}`);
    });

    test('zoom passing 1 next to scalex 3 scales x smoothly (no jump to the override)', async () => {
      const rect = el('dcZoomRect');
      rect.setAttribute('scalex', '3');
      const xScales = [];
      for (const zoom of ['0.99', '1', '1.01']) {
        rect.setAttribute('zoom', zoom);
        xScales.push(rect.getLocalMatrix()[0]);
      }
      const expected = [2.97, 3, 3.03];
      if (xScales.some((s, i) => Math.abs(s - expected[i]) > 0.001)) throw new Error(`x scales ${xScales.map(round).join(', ')}`);
    });

    test('toLocal: unknown names (skewy, scale, typos) warn once at compile time; valid names don\'t', () => {
      const warnings = [];
      const originalWarn = console.warn;
      console.warn = (msg) => warnings.push(msg);
      try {
        // Unique strings, so the compile cache doesn't skip the check
        pxl.compileExpression(`toLocal(ref.dcPart, 'skewy') + ${Math.random()}`);
        pxl.compileExpression(`toLocal(ref.dcPart, 'scale') + ${Math.random()}`);
        pxl.compileExpression(`toLocal(ref.dcPart, "rotat") + ${Math.random()}`);
        pxl.compileExpression(`toLocal(ref.dcPart, 'skewx') + toLocal(ref.dcPart, 'zoom') + ${Math.random()}`);
      } finally {
        console.warn = originalWarn;
      }
      const named = ['skewy', 'scale', 'rotat'].map((name) => warnings.filter((w) => w.includes(`'${name}'`)).length);
      if (warnings.length !== 3 || named.some((n) => n !== 1)) throw new Error(`${warnings.length} warnings: ${warnings.join(' | ')}`);
    });

    // ===================================================================
    // Engine cleanup fixes (design/2026-10-27_engine_cleanup_inventory_note.md §3 A)
    // ===================================================================

    test('grid: bounding box is the visible stage area (corners mapped without a per-frame closure)', () => {
      el('ecStage').resize(); // sizes and draws the stage now (ResizeObserver doesn't fire in a hidden tab)
      const b = el('ecGrid').boundingBox;
      const h = pxl.nodes.ecStage.height;
      if (round(b.left) !== 0 || round(b.top) !== 0 || round(b.right) !== 1000 || round(b.bottom) !== round(h)) {
        throw new Error(`box is ${round(b.left)}, ${round(b.top)} → ${round(b.right)}, ${round(b.bottom)}`);
      }
    });

    test('matrix: a shape moved to another group uses the new group\'s matrix', async () => {
      const mover = el('ecMover');
      if (round(mover.getGlobalMatrix()[4]) !== 120) throw new Error('setup: x is not 120 in group A');
      el('ecGroupB').getGlobalMatrix(); // both groups now have the same matrix version
      el('ecGroupB').appendChild(mover);
      await wait(50);
      const x = mover.getGlobalMatrix()[4];
      if (round(x) !== 320) throw new Error(`global x is ${round(x)}, expected 320 (group B at 300 + 20)`);
    });

    test('InteractionEngine has a class name', () => {
      if (pxl.InteractionEngine.name !== 'InteractionEngine') throw new Error(`name is '${pxl.InteractionEngine.name}'`);
    });

    test('on* handlers can use toLocal()', () => {
      el('ecButton').handlers.click();
      const value = pxl.nodes.ecVar.value;
      if (value !== 640) throw new Error(`ref.ecVar.value is ${value}, expected 640`);
    });

    test('polyline: removing points leaves no points', () => {
      const poly = el('ecPoly');
      poly.removeAttribute('points');
      if (poly._pointCount !== 0) throw new Error(`pointCount is ${poly._pointCount}`);
      if ('p0' in poly.attributeValues) throw new Error('p0 is still set');
    });

    test('stage: renderAvg / renderMax are strings from the start; toLocal(stage) is 0', () => {
      const stage = document.createElement('pxl-stage');
      const { renderAvg, renderMax } = stage.attributeValues;
      if (renderAvg !== '0.00' || renderMax !== '0.00') throw new Error(`renderAvg ${JSON.stringify(renderAvg)}, renderMax ${JSON.stringify(renderMax)}`);
      const result = pxl.toLocal(el('ecTarget'), pxl.nodes.ecStage, 'x');
      if (result !== 0) throw new Error(`toLocal(stage) is ${result}`);
    });

    // --- Run all tests in order ---
    (async () => {
      const results = [];
      const rows = document.getElementById('results');
      await wait(300); // let stages connect and render once

      for (const { name, fn } of tests) {
        let error = null;
        try { await fn(); } catch (e) { error = e; }
        results.push({ name, passed: !error, error: error ? error.message : null });

        const row = rows.insertRow();
        row.insertCell().textContent = error ? '✗' : '✓';
        row.cells[0].className = error ? 'test-fail' : 'test-pass';
        row.insertCell().textContent = name + (error ? ` — ${error.message}` : '');
      }

      const passed = results.filter((r) => r.passed).length;
      const summary = `Tests: ${passed}/${results.length} passed`;
      const summaryEl = document.getElementById('summary');
      summaryEl.textContent = summary;
      summaryEl.className = 'test-summary ' + (passed === results.length ? 'test-pass' : 'test-fail');
      document.title = summary;
      window.kilopixelTests = { passed, total: results.length, results };
    })();
  </script>
</body>
</html>
