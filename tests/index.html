<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engine Tests | Kilopixel</title>
  <link rel="stylesheet" href="../docs/css/docs.css">
  <style>
    .test-summary { font-weight: 700; margin: 16px 0; }
    .test-pass { color: #15803d; }
    .test-fail { color: #b91c1c; }
    .test-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .test-table td { border-bottom: 1px solid #e2e8f0; padding: 6px 8px; vertical-align: top; }
    .test-stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 24px; }
    .test-stages pxl-stage { border: 1px solid #e2e8f0; }
  </style>
  <!-- The built bundle: run `node build.js` before opening this page -->
  <script src="../dist/pxl.min.js"></script>
</head>
<body>
  <main class="docs-content">
    <div class="docs-inner">
      <h1>Engine Tests</h1>
      <p>Open after every engine change (after <code>node build.js</code>), via the dev server: <code>http://localhost:8124/tests/</code>. All tests run automatically; the result is also shown in the tab title (<code>Tests: N/N passed</code>) and stored in <code>window.kilopixelTests</code>. Add a test for every engine fix.</p>

      <p id="summary" class="test-summary">Running…</p>
      <table class="test-table"><tbody id="results"></tbody></table>

      <!-- ================================================================= -->
      <!-- TEST STAGES                                                       -->
      <!-- Every stage uses alwaysrender, so tests also run when off-screen. -->
      <!-- ================================================================= -->
      <div class="test-stages">

        <!-- toLocal: reader inside a rotating, scaled layer (design/2026-10-26_tolocal_fix_plan.md) -->
        <pxl-stage id="tlStage1" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-circle id="tlSun1" x="150" y="150" r="18" fill="#fb923c"></pxl-circle>
          </pxl-layer>
          <pxl-layer x="600" y="350" rotate="t * 12" zoom="1.5">
            <pxl-circle id="tlReader1" x="toLocal(ref.tlSun1, 'x')" y="toLocal(ref.tlSun1, 'y')" r="16" stroke="#1d4ed8" strokewidth="3"></pxl-circle>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal: static move of the reader's layer (setAttribute), then idle -->
        <pxl-stage id="tlStage2" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-circle id="tlSun2" x="150" y="150" r="18" fill="#fb923c"></pxl-circle>
          </pxl-layer>
          <pxl-layer id="tlLayer2" x="600" y="350">
            <pxl-circle id="tlReader2" x="toLocal(ref.tlSun2, 'x')" y="toLocal(ref.tlSun2, 'y')" r="16" stroke="#1d4ed8" strokewidth="3"></pxl-circle>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal: nested group, pxl-var and polyline point readers -->
        <pxl-stage id="tlStage3" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-circle id="tlSun3" x="200" y="150" r="18" fill="#fb923c"></pxl-circle>
          </pxl-layer>
          <pxl-layer x="600" y="350" rotate="t * 12" zoom="1.2">
            <pxl-var id="tlVar3" value="toLocal(ref.tlSun3, 'x')"></pxl-var>
            <pxl-group x="50" y="20" rotate="-t * 30" zoom="0.8">
              <pxl-circle id="tlReader3" x="toLocal(ref.tlSun3, 'x')" y="toLocal(ref.tlSun3, 'y')" r="16" stroke="#1d4ed8" strokewidth="3"></pxl-circle>
              <pxl-polyline id="tlPoly3" points="0,0; toLocal(ref.tlSun3, 'x'), toLocal(ref.tlSun3, 'y')" stroke="#22c55e" strokewidth="3"></pxl-polyline>
            </pxl-group>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal: reader and target in the same moving subtree -->
        <pxl-stage id="tlStage4" ratio="5 / 3" alwaysrender>
          <pxl-layer x="500" y="300" rotate="t * 15">
            <pxl-circle id="tlTarget4" x="200" dx="60" rotate="t * 40" r="18" fill="#fb923c"></pxl-circle>
            <pxl-group x="-150" rotate="t * -25">
              <pxl-circle id="tlReader4" x="toLocal(ref.tlTarget4, 'tx')" y="toLocal(ref.tlTarget4, 'ty')" r="16" stroke="#1d4ed8" strokewidth="3"></pxl-circle>
            </pxl-group>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal: line connecting two circles in other layers (walkthrough §8 case) -->
        <pxl-stage id="tlStage5" ratio="5 / 3" alwaysrender>
          <pxl-layer id="tlLayer5a" x="350" y="250">
            <pxl-circle id="tlCircle5a" x="-150" y="-150" r="40" stroke="#f97316" strokewidth="4"></pxl-circle>
          </pxl-layer>
          <pxl-layer id="tlLayer5b" x="650" y="350">
            <pxl-circle id="tlCircle5b" x="150" y="150" r="40" stroke="#3b82f6" strokewidth="4"></pxl-circle>
          </pxl-layer>
          <pxl-layer id="tlLayer5c">
            <pxl-line id="tlLine5"
              x1="toLocal(ref.tlCircle5a, 'x')" y1="toLocal(ref.tlCircle5a, 'y')"
              x2="toLocal(ref.tlCircle5b, 'x')" y2="toLocal(ref.tlCircle5b, 'y')"
              stroke="#ec4899" strokewidth="4" linedash="[10, 8]">
            </pxl-line>
          </pxl-layer>
        </pxl-stage>

        <!-- ref.<id>.tx / ty: drawn origin in the same space, after the element's own rotate / scale / skew -->
        <pxl-stage id="txStage" ratio="5 / 3" alwaysrender>
          <pxl-layer x="100" y="50">
            <pxl-rect id="txBox" x="300" y="150" dx="150" rotate="90" w="80" h="80" stroke="#f97316" strokewidth="4"></pxl-rect>
            <pxl-circle id="txReader" x="ref.txBox.tx" y="ref.txBox.ty" r="10" fill="#c2410c"></pxl-circle>
          </pxl-layer>
        </pxl-stage>

        <!-- toLocal decomposition and zoom (design/2026-10-29_tolocal_decomposition_plan.md) -->
        <pxl-stage id="dcStage" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-circle id="dcReader" r="1"></pxl-circle>
            <pxl-group x="200" y="100" scalex="-1">
              <pxl-circle id="dcMirror" r="10" fill="#fb923c"></pxl-circle>
            </pxl-group>
            <pxl-rect id="dcSkew" x="400" y="100" skewx="30" w="60" h="40" stroke="#3b82f6"></pxl-rect>
            <pxl-group x="700" y="100" scalex="2" scaley="0.5">
              <pxl-circle id="dcStretched" r="10" fill="#22c55e"></pxl-circle>
            </pxl-group>
            <pxl-rect id="dcZoomRect" x="100" y="450" zoom="2" scalex="1.5" w="20" h="20" stroke="#8b5cf6"></pxl-rect>
          </pxl-layer>
          <pxl-layer x="250" y="300" rotate="30" zoom="1.5">
            <pxl-circle id="dcUniform" r="10" fill="#fb923c"></pxl-circle>
            <pxl-circle id="dcZoomed" x="40" zoom="2" r="6" fill="#3b82f6"></pxl-circle>
          </pxl-layer>
          <!-- Clone rule: the outline copies the part's frame from another space -->
          <pxl-layer x="650" y="350" rotate="t * 12">
            <pxl-group scalex="2">
              <pxl-rect id="dcPart" x="60" rotate="40" dx="30" w="50" h="25" fill="#22c55e"></pxl-rect>
            </pxl-group>
          </pxl-layer>
          <pxl-layer>
            <pxl-rect id="dcClone" x="toLocal(ref.dcPart, 'x')" y="toLocal(ref.dcPart, 'y')"
              rotate="toLocal(ref.dcPart, 'rotate')" skewx="toLocal(ref.dcPart, 'skewx')"
              scalex="toLocal(ref.dcPart, 'scalex')" scaley="toLocal(ref.dcPart, 'scaley')"
              dx="ref.dcPart.dx" dy="ref.dcPart.dy" w="50" h="25" stroke="#0f172a" strokewidth="2"></pxl-rect>
          </pxl-layer>
        </pxl-stage>

        <!-- Engine cleanup fixes (design/2026-10-27_engine_cleanup_inventory_note.md §3 A) -->
        <pxl-stage id="ecStage" ratio="5 / 3" alwaysrender>
          <pxl-layer>
            <pxl-var id="ecVar" value="0"></pxl-var>
            <pxl-grid id="ecGrid" step="100" stroke="#e2e8f0"></pxl-grid>
            <pxl-group id="ecGroupA" x="100">
              <pxl-circle id="ecMover" x="20" y="100" r="12" fill="#fb923c"></pxl-circle>
            </pxl-group>
            <pxl-group id="ecGroupB" x="300"></pxl-group>
            <pxl-circle id="ecTarget" x="640" y="120" r="12" fill="#3b82f6"></pxl-circle>
            <pxl-rect id="ecButton" x="200" y="400" w="80" h="40" fill="#22c55e"
              onclick="ref.ecVar.set('value', toLocal(ref.ecTarget, 'x'))"></pxl-rect>
            <pxl-polyline id="ecPoly" points="100,500; 300,550" stroke="#ec4899" strokewidth="3"></pxl-polyline>
          </pxl-layer>
        </pxl-stage>

        <!-- Stroke gradients on thin shapes, stop offsets, corner radii
             (design/2026-10-11_stroke_gradient_zero_dimension_hardening_plan.md, design/2026-11-05_draw_errors_plan.md §3.1) -->
        <pxl-stage id="gsStage" ratio="5 / 3" alwaysrender>
          <pxl-layer id="gsLayer">
            <!-- The line from docs/line.html section 2 -->
            <pxl-line id="gsLine" x1="550" y1="300" x2="850" y2="300" strokewidth="30" linecap="round"
              stroke="linear(0, ['#3b82f6', '#ec4899'])"></pxl-line>
            <pxl-line id="gsVertical" x1="950" y1="50" x2="950" y2="250" strokewidth="30"
              stroke="linear(0, ['#3b82f6', '#ec4899'])"></pxl-line>
            <pxl-polyline id="gsFlat" points="300,450; 400,450; 500,450" strokewidth="30"
              stroke="linear(90, ['#3b82f6', '#ec4899'])"></pxl-polyline>
            <pxl-line id="gsRadial" x1="550" y1="520" x2="850" y2="520" strokewidth="30"
              stroke="radial(['farthest-side'], ['#3b82f6', '#ec4899'])"></pxl-line>
          </pxl-layer>
        </pxl-stage>

        <!-- Stop offsets outside 0–1 (own stage: before the fix, the error broke every shape drawn after it) -->
        <pxl-stage id="gsStopsStage" ratio="5 / 3" alwaysrender>
          <pxl-layer id="gsStopsLayer">
            <pxl-rect id="gsStops" x="300" y="300" w="300" h="200" fill="linear(0, [0, '#3b82f6', 1, '#ec4899'])"></pxl-rect>
          </pxl-layer>
          <pxl-layer id="gsLateLayer">
            <pxl-rect id="gsLate" x="750" y="300" w="200" h="200" fill="#000000"></pxl-rect>
          </pxl-layer>
        </pxl-stage>

        <!-- Negative corner radius (own stage, same reason) -->
        <pxl-stage id="gsCornersStage" ratio="5 / 3" alwaysrender>
          <pxl-layer id="gsCornersLayer">
            <pxl-rect id="gsCorners" x="500" y="300" w="400" h="300" r="-5" r2="10" fill="#22c55e"></pxl-rect>
          </pxl-layer>
        </pxl-stage>

        <!-- Text box: maxwidth and late web fonts (design/2026-11-06_text_box_accuracy_plan.md) -->
        <pxl-stage id="tbStage" ratio="5 / 3" alwaysrender>
          <pxl-layer id="tbLayer">
            <pxl-text id="tbText" x="500" y="150" size="48" font="Arial" fill="#0f172a" align="center" baseline="middle"
              text="KILOPIXEL DECLARATIVE CANVAS"></pxl-text>
            <pxl-text id="tbChain" x="500" y="300" size="48" font="Arial" fill="#0f172a" text="KILOPIXEL DECLARATIVE CANVAS"></pxl-text>
            <pxl-text id="tbGradient" x="500" y="450" size="48" font="Arial" align="center" fill="linear(0, ['#3b82f6', '#ec4899'])"
              text="KILOPIXEL DECLARATIVE CANVAS"></pxl-text>
            <pxl-text id="tbWrap" x="500" y="520" size="30" font="Arial" fill="#0f172a" align="center" width="800"
              text="Kilopixel draws declarative canvas shapes"></pxl-text>
          </pxl-layer>
        </pxl-stage>
        <pxl-stage id="tbMovingStage" ratio="5 / 3" alwaysrender>
          <pxl-layer id="tbMovingLayer">
            <pxl-text id="tbMoving" x="500" y="300" dx="sin(t * 3) * 40" size="48" font="Arial" fill="#0f172a" align="center" maxwidth="300"
              text="KILOPIXEL DECLARATIVE CANVAS"></pxl-text>
          </pxl-layer>
        </pxl-stage>

        <!-- Safe shape render: each test adds its elements and removes them (design/2026-11-07_safe_shape_render_plan.md) -->
        <pxl-stage id="srStage" ratio="5 / 3" alwaysrender>
          <pxl-layer id="srLayerA"></pxl-layer>
          <pxl-layer id="srLayerB"></pxl-layer>
        </pxl-stage>

      </div>
    </div>
  </main>

  <script>
    // --- Minimal test runner (no dependencies) ---
    const tests = [];
    const test = (name, fn) => tests.push({ name, fn });
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const el = (id) => pxl.nodes[id].$node;
    const round = (n) => Math.round(n * 10) / 10;

    // Stored attribute values of `reader` must equal a fresh toLocal() of `target`
    function expectMapped(readerId, targetId, pairs) {
      const reader = el(readerId), target = pxl.nodes[targetId];
      for (const [attr, prop] of pairs) {
        const stored = reader.attributeValues[attr];
        const fresh = pxl.toLocal(reader, target, prop);
        if (!(Math.abs(stored - fresh) < 0.01)) {
          throw new Error(`${readerId}.${attr} is ${round(stored)}, toLocal(${targetId}, '${prop}') is ${round(fresh)}`);
        }
      }
    }
    const XY = [['x', 'x'], ['y', 'y']];

    // Runs `check` several times while the stages animate
    async function sampled(check, times = 3, gap = 300) {
      for (let i = 0; i < times; i++) {
        await wait(gap);
        check();
      }
    }

    // ===================================================================
    // toLocal (design/2026-10-26_tolocal_fix_plan.md)
    // ===================================================================

    test('toLocal: reader in a rotating, scaled layer follows a still target', () =>
      sampled(() => expectMapped('tlReader1', 'tlSun1', XY)));

    test('toLocal: static move of the reader\'s layer updates the reader', async () => {
      expectMapped('tlReader2', 'tlSun2', XY);
      const layer = el('tlLayer2');
      layer.setAttribute('x', '450');
      layer.setAttribute('rotate', '35');
      layer.setAttribute('zoom', '1.4');
      await wait(100);
      expectMapped('tlReader2', 'tlSun2', XY);
    });

    test('toLocal: nothing redraws while nothing moves (stage idle at 0 FPS)', async () => {
      await wait(2200); // fps is published once per second
      const fps = pxl.nodes.tlStage2.fps;
      if (fps !== 0) throw new Error(`static stage renders at ${fps} FPS`);
    });

    test('toLocal: reader in a nested group inside a rotating layer', () =>
      sampled(() => expectMapped('tlReader3', 'tlSun3', XY)));

    test('toLocal: <pxl-var> reader inside a rotating layer', () =>
      sampled(() => expectMapped('tlVar3', 'tlSun3', [['value', 'x']])));

    test('toLocal: polyline point reader inside a rotating layer', () =>
      sampled(() => expectMapped('tlPoly3', 'tlSun3', [['p2', 'x'], ['p3', 'y']])));

    test('toLocal: reader and target in the same moving subtree', () =>
      sampled(() => expectMapped('tlReader4', 'tlTarget4', [['x', 'tx'], ['y', 'ty']])));

    test('toLocal: line follows when its own layer moves (walkthrough §8 case)', async () => {
      const ends = (a, b) => { expectMapped('tlLine5', a, [['x1', 'x'], ['y1', 'y']]); expectMapped('tlLine5', b, [['x2', 'x'], ['y2', 'y']]); };
      ends('tlCircle5a', 'tlCircle5b');
      const layer = el('tlLayer5c');
      layer.setAttribute('x', '500');
      layer.setAttribute('y', '300');
      layer.setAttribute('rotate', '30');
      await wait(100);
      ends('tlCircle5a', 'tlCircle5b');
    });

    test('toLocal: line follows when a target\'s layer moves (target side)', async () => {
      el('tlLayer5b').setAttribute('rotate', '45');
      el('tlLayer5a').setAttribute('zoom', '0.7');
      await wait(100);
      expectMapped('tlLine5', 'tlCircle5a', [['x1', 'x'], ['y1', 'y']]);
      expectMapped('tlLine5', 'tlCircle5b', [['x2', 'x'], ['y2', 'y']]);
    });

    test('toLocal: replacing a toLocal attribute with a number removes it from toLocalAttributeKeys', async () => {
      const reader = el('tlReader2');
      if (!reader.toLocalAttributeKeys.includes('x')) throw new Error('x missing before the change');
      reader.setAttribute('x', '10');
      if (reader.toLocalAttributeKeys.includes('x')) throw new Error('x still listed after setAttribute(\'x\', \'10\')');
      reader.setAttribute('x', "toLocal(ref.tlSun2, 'x')");
      if (!reader.toLocalAttributeKeys.includes('x')) throw new Error('x not listed again after restoring toLocal');
    });

    // ===================================================================
    // ref.<id>.tx / ty
    // ===================================================================

    test('ref.tx: includes the element\'s own rotate (x=300, dx=150, rotate=90 → 300, 300)', () => {
      const { tx, ty } = pxl.nodes.txBox;
      if (Math.abs(tx - 300) > 0.01 || Math.abs(ty - 300) > 0.01) throw new Error(`tx, ty is ${round(tx)}, ${round(ty)}`);
    });

    test('ref.tx: same-space reader follows rotate / scale / skew changes and equals toLocal(…, \'tx\')', async () => {
      expectMapped('txReader', 'txBox', [['x', 'tx'], ['y', 'ty']]);
      const box = el('txBox');
      box.setAttribute('rotate', '35');
      box.setAttribute('scalex', '1.5');
      box.setAttribute('skewx', '20');
      box.setAttribute('dy', '40');
      await wait(100);
      expectMapped('txReader', 'txBox', [['x', 'tx'], ['y', 'ty']]);
    });

    // ===================================================================
    // toLocal decomposition and zoom (design/2026-10-29_tolocal_decomposition_plan.md)
    // ===================================================================

    // toLocal() of `targetId` as seen from dcReader (untransformed layer), compared with `expected`
    function expectFrame(targetId, expected) {
      for (const prop in expected) {
        const value = pxl.toLocal(el('dcReader'), pxl.nodes[targetId], prop);
        if (!(Math.abs(value - expected[prop]) < 0.01)) {
          throw new Error(`toLocal(${targetId}, '${prop}') is ${round(value)}, expected ${expected[prop]}`);
        }
      }
    }

    test('toLocal decomposition: a mirrored target rebuilds as a mirror, not a 180° turn', () =>
      expectFrame('dcMirror', { rotate: 180, scalex: 1, scaley: -1, skewx: 0, zoom: 1 }));

    test('toLocal decomposition: skewx="30" comes back as skewx 30', () =>
      expectFrame('dcSkew', { rotate: 0, scalex: 1, scaley: 1, skewx: 30, zoom: 1 }));

    test('toLocal decomposition: uniform layer (rotate 30, zoom 1.5) gives zoom = scalex = scaley', () =>
      expectFrame('dcUniform', { rotate: 30, scalex: 1.5, scaley: 1.5, skewx: 0, zoom: 1.5 }));

    test('toLocal zoom: zoom 2 in a layer with zoom 1.5 is 3, also with skew; a stretched group gives the area factor', async () => {
      expectFrame('dcZoomed', { zoom: 3 });
      el('dcZoomed').setAttribute('skewx', '30');
      await wait(50);
      expectFrame('dcZoomed', { zoom: 3 });
      expectFrame('dcStretched', { scalex: 2, scaley: 0.5, zoom: 1 });
    });

    test('toLocal clone rule: the outline\'s global matrix equals the part\'s while the layer turns', () =>
      sampled(() => {
        const part = el('dcPart').getGlobalMatrix(), clone = el('dcClone').getGlobalMatrix();
        for (let i = 0; i < 6; i++) {
          if (!(Math.abs(part[i] - clone[i]) < 0.01)) {
            throw new Error(`matrix entry ${i}: part ${round(part[i])}, clone ${round(clone[i])}`);
          }
        }
      }));

    test('zoom multiplies scalex / scaley: zoom 2 and scalex 1.5 give 3 / 2', () => {
      const m = el('dcZoomRect').getLocalMatrix();
      if (round(m[0]) !== 3 || round(m[3]) !== 2) throw new Error(`scale is ${round(m[0])} / ${round(m[3])}`);
    });

    test('zoom passing 1 next to scalex 3 scales x smoothly (no jump to the override)', async () => {
      const rect = el('dcZoomRect');
      rect.setAttribute('scalex', '3');
      const xScales = [];
      for (const zoom of ['0.99', '1', '1.01']) {
        rect.setAttribute('zoom', zoom);
        xScales.push(rect.getLocalMatrix()[0]);
      }
      const expected = [2.97, 3, 3.03];
      if (xScales.some((s, i) => Math.abs(s - expected[i]) > 0.001)) throw new Error(`x scales ${xScales.map(round).join(', ')}`);
    });

    test('toLocal: unknown names (skewy, scale, typos) warn once at compile time; valid names don\'t', () => {
      const warnings = [];
      const originalWarn = console.warn;
      console.warn = (msg) => warnings.push(msg);
      try {
        // Unique strings, so the compile cache doesn't skip the check
        pxl.compileExpression(`toLocal(ref.dcPart, 'skewy') + ${Math.random()}`);
        pxl.compileExpression(`toLocal(ref.dcPart, 'scale') + ${Math.random()}`);
        pxl.compileExpression(`toLocal(ref.dcPart, "rotat") + ${Math.random()}`);
        pxl.compileExpression(`toLocal(ref.dcPart, 'skewx') + toLocal(ref.dcPart, 'zoom') + ${Math.random()}`);
      } finally {
        console.warn = originalWarn;
      }
      const named = ['skewy', 'scale', 'rotat'].map((name) => warnings.filter((w) => w.includes(`'${name}'`)).length);
      if (warnings.length !== 3 || named.some((n) => n !== 1)) throw new Error(`${warnings.length} warnings: ${warnings.join(' | ')}`);
    });

    // ===================================================================
    // Engine cleanup fixes (design/2026-10-27_engine_cleanup_inventory_note.md §3 A)
    // ===================================================================

    test('grid: bounding box is the visible stage area (corners mapped without a per-frame closure)', () => {
      el('ecStage').resize(); // sizes and draws the stage now (ResizeObserver doesn't fire in a hidden tab)
      const b = el('ecGrid').boundingBox;
      const h = pxl.nodes.ecStage.height;
      if (round(b.left) !== 0 || round(b.top) !== 0 || round(b.right) !== 1000 || round(b.bottom) !== round(h)) {
        throw new Error(`box is ${round(b.left)}, ${round(b.top)} → ${round(b.right)}, ${round(b.bottom)}`);
      }
    });

    test('matrix: a shape moved to another group uses the new group\'s matrix', async () => {
      const mover = el('ecMover');
      if (round(mover.getGlobalMatrix()[4]) !== 120) throw new Error('setup: x is not 120 in group A');
      el('ecGroupB').getGlobalMatrix(); // both groups now have the same matrix version
      el('ecGroupB').appendChild(mover);
      await wait(50);
      const x = mover.getGlobalMatrix()[4];
      if (round(x) !== 320) throw new Error(`global x is ${round(x)}, expected 320 (group B at 300 + 20)`);
    });

    test('InteractionEngine has a class name', () => {
      if (pxl.InteractionEngine.name !== 'InteractionEngine') throw new Error(`name is '${pxl.InteractionEngine.name}'`);
    });

    test('on* handlers can use toLocal()', () => {
      el('ecButton').handlers.click();
      const value = pxl.nodes.ecVar.value;
      if (value !== 640) throw new Error(`ref.ecVar.value is ${value}, expected 640`);
    });

    test('polyline: removing points leaves no points', () => {
      const poly = el('ecPoly');
      poly.removeAttribute('points');
      if (poly._pointCount !== 0) throw new Error(`pointCount is ${poly._pointCount}`);
      if ('p0' in poly.attributeValues) throw new Error('p0 is still set');
    });

    test('stage: renderAvg / renderMax are strings from the start; toLocal(stage) is 0', () => {

    // ===================================================================
    // Stroke gradients on thin shapes (design/2026-10-11_stroke_gradient_zero_dimension_hardening_plan.md)
    // and stop offsets / corner radii (design/2026-11-05_draw_errors_plan.md §3.1)
    // ===================================================================

    // Pixel [r, g, b, a] of a layer canvas at a stage position. Draws the stage first: resize() renders now
    // (the ResizeObserver doesn't fire in a hidden tab).
    function pixelAt(layerId, x, y) {
      const layer = el(layerId);
      const stage = layer.stage;
      const k = stage.unit * layer._canvas.width / stage.clientWidth;
      return [...layer._ctx.getImageData(Math.round(x * k), Math.round(y * k), 1, 1).data];
    }
    const isBlueish = ([r, , b]) => b > r;
    const isPinkish = ([r, , b]) => r > b;
    const rgba = (p) => `rgba(${p.join(', ')})`;

    test('stroke gradient: the docs line (line.html §2) stays visible at every angle, 0–360° in steps of 15', () => {
      const line = el('gsLine');
      const hidden = [];
      for (let angle = 0; angle <= 360; angle += 15) {
        line.setAttribute('stroke', `linear(${angle}, ['#3b82f6', '#ec4899'])`);
        el('gsStage').resize();
        const center = pixelAt('gsLayer', 700, 300);
        if (center[3] === 0) hidden.push(`${angle}°`);
      }
      if (hidden.length) throw new Error(`line invisible at ${hidden.join(', ')}`);

      // 90°: blue at the top edge of the 30-unit stroke, pink at the bottom; 270° the other way round
      for (const [angle, top, bottom] of [[90, isBlueish, isPinkish], [270, isPinkish, isBlueish]]) {
        line.setAttribute('stroke', `linear(${angle}, ['#3b82f6', '#ec4899'])`);
        el('gsStage').resize();
        const above = pixelAt('gsLayer', 700, 289), below = pixelAt('gsLayer', 700, 311);
        if (!top(above) || !bottom(below)) throw new Error(`${angle}°: above ${rgba(above)}, below ${rgba(below)}`);
      }
      line.setAttribute('stroke', "linear(0, ['#3b82f6', '#ec4899'])");
    });

      el('gsStage').resize();

        ['flat polyline', pixelAt('gsLayer', 400, 450), pixelAt('gsLayer', 400, 439), pixelAt('gsLayer', 400, 461)]
      ];
      for (const [name, center, start, end] of checks) {
        if (center[3] === 0) throw new Error(`${name} is invisible`);
        if (!isBlueish(start) || !isPinkish(end)) throw new Error(`${name}: start ${rgba(start)}, end ${rgba(end)}`);

    // ===================================================================
    // Text box: maxwidth and late web fonts (design/2026-11-06_text_box_accuracy_plan.md)
    // ===================================================================

    // resize() also works in a background tab, where the stage may not have a size yet
    const drawTextStage = () => el('tbStage').resize();

    // Draws the text stage with the given attributes on tbText and returns a copy of its box
    const textBox = (attributes, id = 'tbText') => {
      for (const [name, value] of Object.entries(attributes)) el(id).setAttribute(name, value);
      drawTextStage();
      return { ...el(id).boundingBox };
    };

    // Number of measureText() calls while fn runs
    function countMeasureText(fn) {
      const proto = CanvasRenderingContext2D.prototype, original = proto.measureText;
      let calls = 0;
      proto.measureText = function(text) { calls++; return original.call(this, text); };
      try { fn(); } finally { proto.measureText = original; }
      return calls;
    }

    test('text box: a squeezed line scales both sides of the box by the same factor', () => {
      const full = textBox({ maxwidth: '0', text: 'KILOPIXEL DECLARATIVE CANVAS' });
      const squeezed = textBox({ maxwidth: '200' });
      const width = squeezed.right - squeezed.left;
      if (width > 202) throw new Error(`box is ${round(width)} wide with maxwidth 200`);
      const leftFactor = squeezed.left / full.left, rightFactor = squeezed.right / full.right;
      if (Math.abs(leftFactor - rightFactor) > 0.001) throw new Error(`left ×${leftFactor}, right ×${rightFactor}`);
    });

    test('text box: maxwidth larger than the line leaves the box unchanged', () => {
      const full = textBox({ maxwidth: '0', text: 'KILOPIXEL DECLARATIVE CANVAS' });
      const wide = textBox({ maxwidth: '5000' });
      if (wide.left !== full.left || wide.right !== full.right) throw new Error(`${wide.left}, ${wide.right} instead of ${full.left}, ${full.right}`);
    });

    test('text box: each line has its own squeeze factor, whatever the line order', () => {
      const long = 'A much longer line that has to be squeezed', short = 'Short line';
      const alone = textBox({ maxwidth: '300', text: long });
      const shortFirst = textBox({ text: `${short}\\n${long}` });
      const longFirst = textBox({ text: `${long}\\n${short}` });
      for (const box of [shortFirst, longFirst]) {
        if (Math.abs(box.right - alone.right) > 0.01 || Math.abs(box.left - alone.left) > 0.01) {
          throw new Error(`box ${round(box.left)}, ${round(box.right)} instead of ${round(alone.left)}, ${round(alone.right)}`);
        }
      }
    });

    test('text box: changing maxwidth measures each line once, and not again on the next frame', () => {
      const before = textBox({ maxwidth: '400', text: 'Line one is long enough\\nLine two is long enough too\\nLine three is the longest line of them' });
      let after;
      const calls = countMeasureText(() => { after = textBox({ maxwidth: '200' }); });
      if (calls !== 3) throw new Error(`${calls} measureText calls for 3 lines`);
      if (after.right >= before.right) throw new Error('the box did not follow maxwidth');
      const nextFrame = countMeasureText(drawTextStage);
      if (nextFrame !== 0) throw new Error(`${nextFrame} measureText calls on the next frame`);
    });

    test('text box: moving text with a static maxwidth never measures', () => {
      const stage = el('tbMovingStage'), text = el('tbMoving');
      const first = text.attributeValues.dx;

      stage.resize();
      stage.render(t);
      const calls = countMeasureText(() => {
        for (let i = 0; i < 10; i++) {
          stage.render(t += 0.1);
          if (text.attributeValues.dx !== first) moved = true;
        }
      });
      if (!moved) throw new Error('the text did not move');
      if (calls !== 0) throw new Error(`${calls} measureText calls in 10 frames`);

    test('text box: after any chain of attribute changes, the box equals that of a new text', () => {
      const chain = [
        ['maxwidth', '200'], ['maxwidth', '100'], ['align', 'right'], ['maxwidth', '0'], ['maxwidth', '150'], ['baseline', 'top'],
        ['lineheight', '2'], ['maxwidth', '80'], ['text', 'A much longer text for a second round of checks'], ['maxwidth', '300'],
        ['text', 'Line one is long enough\\nTwo\\nLine three is longer than line one'], ['maxwidth', '120'], ['width', '300'], ['size', '30'],
        ['maxwidth', '90'], ['font', 'Georgia'], ['weight', '700'], ['letterspacing', '4'], ['maxwidth', '0'], ['maxwidth', '500'], ['direction', 'rtl'],
        ['maxwidth', '60'], ['direction', 'ltr'], ['align', 'center'], ['baseline', 'middle'], ['width', '0'], ['lineheight', '1'], ['maxwidth', '1000']
      ];
      const live = el('tbChain');
      const boxOf = (text) => ['left', 'right', 'top', 'bottom'].map((k) => text.boundingBox[k].toFixed(4)).join(', ');
      for (const [name, value] of chain) {
        live.setAttribute(name, value);
        drawTextStage();

        for (const attribute of live.attributes) {
          if (attribute.name !== 'id') fresh.setAttribute(attribute.name, attribute.value);

    test('late font: loadingdone raises the generation, invalidates every layer and measures again', () => {
      const lines = el('tbWrap')._lines.length + el('tbText')._lines.length + el('tbChain')._lines.length + el('tbGradient')._lines.length;
      drawTextStage();
      const before = pxl._fontGeneration;
      document.querySelectorAll('pxl-layer').forEach((layer) => { layer.isDirty = false; });
      document.fonts.dispatchEvent(new Event('loadingdone'));
      if (pxl._fontGeneration !== before + 1) throw new Error(`generation ${pxl._fontGeneration}, expected ${before + 1}`);
      const clean = [...document.querySelectorAll('pxl-layer')].filter((layer) => !layer.isDirty);
      if (clean.length) throw new Error(`${clean.length} layers are not dirty`);
      const calls = countMeasureText(drawTextStage);
      if (calls < lines) throw new Error(`${calls} measureText calls for ${lines} lines`);
    });

    test('late font: wrapping and box follow when the arriving font has other metrics', () => {
      const text = el('tbWrap');
      drawTextStage();
      const linesBefore = text._lines.length, rightBefore = text.boundingBox.right;

      // Stands in for a wider font: the font string stays the same and only the measured values change
      const proto = CanvasRenderingContext2D.prototype, original = proto.measureText;
      proto.measureText = function(value) {
        const m = original.call(this, value);
        return {
          width: m.width * 2, actualBoundingBoxLeft: m.actualBoundingBoxLeft * 2, actualBoundingBoxRight: m.actualBoundingBoxRight * 2,
          actualBoundingBoxAscent: m.actualBoundingBoxAscent, actualBoundingBoxDescent: m.actualBoundingBoxDescent
        };
      };
      let linesNoEvent, linesAfter;
      try {
        drawTextStage();
        linesNoEvent = text._lines.length;
        document.fonts.dispatchEvent(new Event('loadingdone'));
        drawTextStage();
        linesAfter = text._lines.length;
      } finally {
        proto.measureText = original;
      }
      if (linesNoEvent !== linesBefore) throw new Error('the text measured again without an event');
      if (linesAfter <= linesBefore) throw new Error(`still ${linesAfter} lines after the font change`);

      document.fonts.dispatchEvent(new Event('loadingdone'));
      drawTextStage();
      if (text._lines.length !== linesBefore || text.boundingBox.right !== rightBefore) throw new Error('did not return to the first layout');
    });

    // ===================================================================
    // Safe shape render: always save / restore, draw errors (design/2026-11-07_safe_shape_render_plan.md)
    // ===================================================================

    // Test shapes, the way a custom shape would be written
    customElements.define('test-leak-shape', class extends pxl.Shape {
      draw(ctx) { ctx.globalAlpha = 0.2; }   // changes state and never resets it
    });
    customElements.define('test-probe-shape', class extends pxl.Shape {
      draw(ctx) {
        this.seen = { alpha: ctx.globalAlpha, miter: ctx.miterLimit, lineWidth: ctx.lineWidth, fill: ctx.fillStyle, dash: ctx.getLineDash().length };
      }
    });
    customElements.define('test-throw-shape', class extends pxl.Shape {
      draw() { throw new Error('test shape failed'); }
    });
    customElements.define('test-noisy-shape', class extends pxl.Shape {
      draw() { this.calls = (this.calls || 0) + 1; throw new RangeError(`value ${this.calls} is invalid`); }
    });

    // Renders the test stage at time t; resize() first, so it also works in a background tab
    function srRender(t) {
      const stage = el('srStage');
      if (stage.unit === 0) stage.resize();
      stage.querySelectorAll('pxl-layer').forEach((layer) => { layer.isDirty = true; });
      stage.render(t);
    }
    const srAdd = (layerId, html) => el(layerId).insertAdjacentHTML('beforeend', html);
    function srClear() {
      for (const id of ['srLayerA', 'srLayerB']) el(id).querySelectorAll(':scope > :not(canvas)').forEach((n) => n.remove());
      document.querySelectorAll('#srStage > pxl-layer:not(#srLayerA):not(#srLayerB)').forEach((n) => n.remove());
    }
    // console.warn calls while fn runs
    function captureWarnings(fn) {
      const original = console.warn, out = [];
      console.warn = (...args) => out.push(args.join(' '));
      try { fn(); } finally { console.warn = original; }
      return out;
    }
    const layerTransform = (id) => el(id)._ctx.getTransform().toString();

      srRender(2);   // the second frame shows leaks into shapes drawn before the careless one
      for (const x of [100, 300]) {

      }
      srClear();
    });

      srClear();
      srAdd('srLayerA', `<pxl-var id="srClock" value="t"></pxl-var>
        <pxl-circle id="srBadReader" x="ref.srClock.value > 0.5 ? missingFunction() : 100" r="5"></pxl-circle>
        <pxl-circle id="srGoodReader" x="ref.srClock.value * 10" r="5"></pxl-circle>`);
      const warnings = captureWarnings(() => srRender(1));
      if (el('srClock').attributeValues.value !== 1) throw new Error(`the variable is ${el('srClock').attributeValues.value}`);
      if (el('srGoodReader').attributeValues.x !== 10) throw new Error(`the other reader is at ${el('srGoodReader').attributeValues.x}`);
      if (warnings.some((w) => w.includes('id="srClock"')) || !warnings.some((w) => w.includes('id="srBadReader"'))) throw new Error(`warnings: ${JSON.stringify(warnings)}`);
      srClear();
    });

    test('safe render: a toLocal reader that fails when its group moves is blamed itself; the group draws', () => {
      srClear();
      srAdd('srLayerA', `<pxl-circle id="srTlTarget" x="40" y="40" r="5"></pxl-circle>
        <pxl-group id="srTlGroup" x="t * 100">
          <pxl-circle id="srTlReader" x="toLocal(ref.srTlTarget, 'x') < 0 ? missingFunction() : 0" r="5"></pxl-circle>
          <pxl-rect x="0" y="300" w="40" h="40" fill="#00ff00"></pxl-rect>
        </pxl-group>`);
      const warnings = captureWarnings(() => srRender(1));
      if (warnings.some((w) => w.includes('id="srTlGroup"')) || !warnings.some((w) => w.includes('id="srTlReader"'))) throw new Error(`warnings: ${JSON.stringify(warnings)}`);
      const sibling = pixelAt('srLayerA', 100, 300);
      if (sibling[1] !== 255) throw new Error(`the group's rect is ${rgba(sibling)}`);
      srClear();
    });

    test('safe render: an element warns at most 3 times, the third says that more are hidden', () => {
      srClear();
      srAdd('srLayerA', `<test-noisy-shape id="srNoisy"></test-noisy-shape>`);
      const warnings = captureWarnings(() => { for (let i = 0; i < 6; i++) srRender(1 + i); });
      if (warnings.length !== 3 || !warnings[2].includes('further errors')) throw new Error(`warnings: ${JSON.stringify(warnings)}`);
      srClear();
    });

    test('polyline: an invalid coordinate draws nothing (no dropped vertex, no gradient error), then draws once valid', () => {
      srClear();
      srAdd('srLayerA', `<pxl-polyline id="srPolyNaN" points="100, 300; ref.srPolyX.value, 300; 300, 400" stroke="linear(0, ['#ff0000', '#0000ff'])" strokewidth="10"></pxl-polyline>
        <pxl-polyline id="srPolyAllNaN" points="ref.srPolyX.value, 100; ref.srPolyX.value, 200" stroke="linear(0, ['#ff0000', '#0000ff'])" strokewidth="10"></pxl-polyline>`);
      const warnings = captureWarnings(() => srRender(1));
      if (warnings.length) throw new Error(`warnings: ${JSON.stringify(warnings)}`);
      if (pixelAt('srLayerA', 100, 300)[3] !== 0) throw new Error('drawn although one coordinate is undefined');
      // Hit testing uses draw(): not hittable either
      const ctx = pxl.dummyCtx;
      pxl._hitX = 100 * el('srStage').unit; pxl._hitY = 300 * el('srStage').unit; pxl._hitResult = false;
      ctx.save(); ctx.beginPath(); el('srPolyNaN').draw(ctx, el('srStage').unit, 0); ctx.restore();
      if (pxl._hitResult) throw new Error('hittable although one coordinate is undefined');
      srAdd('srLayerB', `<pxl-var id="srPolyX" value="200"></pxl-var>`);
      srRender(2);
      if (pixelAt('srLayerA', 150, 300)[3] === 0) throw new Error('not drawn after the coordinate became valid');
      srClear();
    });

    // --- Run all tests in order ---
    (async () => {
      const results = [];
      const rows = document.getElementById('results');
      await wait(300); // let stages connect and render once

      for (const { name, fn } of tests) {
        let error = null;
        try { await fn(); } catch (e) { error = e; }
        results.push({ name, passed: !error, error: error ? error.message : null });

        const row = rows.insertRow();
        row.insertCell().textContent = error ? '✗' : '✓';
        row.cells[0].className = error ? 'test-fail' : 'test-pass';
        row.insertCell().textContent = name + (error ? ` — ${error.message}` : '');
      }

      const passed = results.filter((r) => r.passed).length;
      const summary = `Tests: ${passed}/${results.length} passed`;
      const summaryEl = document.getElementById('summary');
      summaryEl.textContent = summary;
      summaryEl.className = 'test-summary ' + (passed === results.length ? 'test-pass' : 'test-fail');
      document.title = summary;
      window.kilopixelTests = { passed, total: results.length, results };
    })();
  </script>
</body>
</html>
