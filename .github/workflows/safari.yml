# Runs Kilopixel's checks in real Safari on a macOS machine (tools/safari.js): the test pages, the sweep of every docs
# and example page, the text and canvas measurements of design/2026-11-20_custom_shapes_plan.md §5.3, screenshots.
# Started by hand only (Actions tab → Safari → Run workflow): a macOS run takes several minutes.
name: Safari

on:
  workflow_dispatch:

jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Allows WebDriver automation of Safari (once per machine; GitHub's macOS runners allow sudo)
      - run: sudo safaridriver --enable
      - run: node tools/safari.js
      # The results also when a check failed: results.json, summary.md and the screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-results
          path: scratch/safari/
