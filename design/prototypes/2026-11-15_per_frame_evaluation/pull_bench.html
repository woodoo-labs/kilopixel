<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Per-frame evaluation bench</title>
  <script src="/dist/pxl.min.js"></script>
  <style>body { margin: 0; font: 14px monospace; } pxl-stage { width: 800px; }</style>
</head>
<body>
  <!-- design/2026-11-15_per_frame_evaluation_plan.md §5: today's broadcast against evaluating readers in a plain
       per-frame loop, on the real engine's compiled expressions. Call run() or open the page and wait. -->
  <pre id="out">Running…</pre>
  <pxl-stage id="bench" ratio="16 / 9" alwaysrender>
    <pxl-var id="a" value="5"></pxl-var>
    <pxl-layer id="benchLayer"></pxl-layer>
  </pxl-stage>
  <script>
    // performance.now() is coarsened to 0.1 ms, so every sample runs fn several times
    const median = (fn, runs = 15, reps = 20) => {
      const times = [];
      for (let i = 0; i < runs; i++) {
        const s = performance.now();
        for (let r = 0; r < reps; r++) fn();
        times.push((performance.now() - s) / reps);
      }
      return times.sort((x, y) => x - y)[runs >> 1];
    };
    const round = (ms) => Math.round(ms * 1000) / 1000;

    function build(n, attrs) {
      let html = '';
      for (let i = 0; i < n; i++) html += `<pxl-circle x="${(i * 37) % 1000}" y="${(i * 91) % 560}" r="4" fill="#38bdf8" ${attrs(i)}></pxl-circle>`;
      const layer = document.getElementById('benchLayer');
      layer.innerHTML = html;
      return [...layer.children];
    }

    // What an update loop would do per reader: evaluate each reactive attribute, compare, store, mark the matrix
    function pullAll(shapes) {
      let changed = 0;
      for (let i = 0; i < shapes.length; i++) {
        const el = shapes[i], keys = el.reactiveAttributeKeys, values = el.attributeValues;
        for (let k = 0; k < keys.length; k++) {
          const key = keys[k];
          const v = el.attributeExpressions[key].call(el, 0);
          if (values[key] !== v) {
            values[key] = v;
            changed++;
            if (pxl.isSpatialKey(key)) el._isLocalMatrixDirty = true;
          }
        }
      }
      return changed;
    }

    let benchSources = [], benchSeen = new Float64Array(0), benchCounter = 1;
    const benchSource = { version: 1 };

    // The same loop with a version check first: a reader is evaluated only when one of its sources changed
    function pullChecked(shapes) {
      let changed = 0;
      for (let i = 0; i < shapes.length; i++) {
        const el = shapes[i], sources = benchSources[i];
        let stale = false;
        for (let s = 0; s < sources.length; s++) {
          if (sources[s].version > benchSeen[i]) { stale = true; break; }
        }
        if (!stale) continue;
        benchSeen[i] = benchCounter;
        const keys = el.reactiveAttributeKeys, values = el.attributeValues;
        for (let k = 0; k < keys.length; k++) {
          const key = keys[k];
          const v = el.attributeExpressions[key].call(el, 0);
          if (values[key] !== v) {
            values[key] = v;
            changed++;
            if (pxl.isSpatialKey(key)) el._isLocalMatrixDirty = true;
          }
        }
      }
      return changed;
    }

    // Kahn's algorithm on plain objects: a chain of n nodes, each also reading one earlier node
    function orderGraph(n) {
      const nodes = [];
      for (let i = 0; i < n; i++) nodes.push({ sources: [], readers: [], pending: 0 });
      for (let i = 1; i < n; i++) {
        for (const j of [i - 1, (i * 7919) % i]) { nodes[i].sources.push(nodes[j]); nodes[j].readers.push(nodes[i]); }
      }
      return median(() => {
        const order = [];
        for (let i = 0; i < n; i++) { nodes[i].pending = nodes[i].sources.length; if (nodes[i].pending === 0) order.push(nodes[i]); }
        for (let i = 0; i < order.length; i++) {
          const readers = order[i].readers;
          for (let r = 0; r < readers.length; r++) if (--readers[r].pending === 0) order.push(readers[r]);
        }
        if (order.length !== n) throw new Error('order incomplete');
      }, 11, 5);
    }

    window.run = async function() {
      await new Promise((r) => setTimeout(r, 300));
      const stage = document.getElementById('bench'), a = document.getElementById('a'), source = pxl.nodes.a;
      if (stage.unit === 0) stage.resize();
      const result = {};

      // ?n=5000 runs one size alone (the order of the runs must not matter)
      const only = Number(new URLSearchParams(location.search).get('n'));
      for (const n of only ? [only] : [1000, 5000]) {
        const shapes = build(n, (i) => `dy="ref.a.value * ${i % 50}"`);
        stage.render(1);
        let v = 0;

        // Today: the variable changes, broadcast() re-evaluates every reader
        const broadcast = median(() => { source.value = (v += 0.01); pxl.broadcast('ref.a'); });

        // Pull: the variable changes, a plain loop evaluates every reader
        const pullChanged = median(() => { source.value = (v += 0.01); pullAll(shapes); });

        // Pull, nothing changed: every reader is evaluated again, all values equal
        const pullUnchanged = median(() => { pullAll(shapes); });

        // Pull with a version check, nothing changed: no evaluation at all
        benchCounter = 1;
        benchSource.version = 1;
        benchSources = shapes.map(() => [benchSource]);
        benchSeen = new Float64Array(n).fill(1);
        const checkedUnchanged = median(() => { pullChecked(shapes); });

        // Pull with a version check, the source changed
        const checkedChanged = median(() => { source.value = (v += 0.01); benchSource.version = ++benchCounter; pullChecked(shapes); });

        const perReader = (ms) => `${round(ms)} ms, ${Math.round(ms * 1e6 / n)} ns per reader`;
        result[`${n} readers`] = {
          'today: broadcast, source changed': perReader(broadcast),
          'pull all, source changed': perReader(pullChanged),
          'pull all, nothing changed': perReader(pullUnchanged),
          'pull with version check, source changed': perReader(checkedChanged),
          'pull with version check, nothing changed': perReader(checkedUnchanged)
        };
      }

      result['order a graph of 1,000 nodes, 2 sources each (ms)'] = round(orderGraph(1000));
      result['order a graph of 10,000 nodes, 2 sources each (ms)'] = round(orderGraph(10000));

      document.getElementById('benchLayer').innerHTML = '';
      document.getElementById('out').textContent = JSON.stringify(result, null, 2);
      return result;
    };
    window.run();
  </script>
</body>
</html>
