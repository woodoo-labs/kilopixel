<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Isolation prototype</title>
  <script src="/dist/pxl.js"></script>
  <style>
    body { margin: 16px; font-family: sans-serif; }
    .box { width: 800px; border: 1px solid #ccc; margin-bottom: 12px; }
  </style>
</head>
<body>
<pre id="out">running…</pre>
<div class="box" id="checkBox"></div>
<div class="box" id="benchBox"></div>
<script>
// Prototype of design/done/2026-11-01_isolated_shape_compositing_plan.md (2026-11-20) as a patch over today's engine:
// Shape.render() draws a shape with compositing state and more than one draw call into a shared scratch canvas,
// then composites it once onto the layer. window.ISO: 'direct' (today), 'full' (scratch of the layer's size),
// 'bbox' (only the shape's device box), 'force' (full, also without compositing state: for the transform check).
// Measured against the engine before isolation was built (git show 2462f39:dist/pxl.js). With a later engine,
// 'direct' calls the built Shape.render(), which isolates as well; the transform check still compares both paths.
window.ISO = 'direct';
const scratch = document.createElement('canvas');
const sctx = scratch.getContext('2d');
const box = { x0: 0, y0: 0, x1: 0, y1: 0 };

function hasCompositing(av) {
  return av.mask !== 'none' || av.blend !== 'source-over' || av.filter !== 'none' ||
         (av.shadowcolor && av.shadowcolor !== 'none' && av.shadowcolor !== 'transparent');
}

// The shape's box (getBoundingBox() plus what a stroke can reach) through the global matrix, in device pixels
function deviceBox(shape, u, dpr, w, h) {
  const m = shape.getGlobalMatrix(), b = shape.getBoundingBox(), pad = shape.hitPadding();
  const l = Math.min(b.left, b.right) - pad, r = Math.max(b.left, b.right) + pad;
  const t = Math.min(b.top, b.bottom) - pad, btm = Math.max(b.top, b.bottom) + pad;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < 4; i++) {
    const lx = i & 1 ? r : l, ly = i & 2 ? btm : t;
    const px = (m[0] * lx + m[2] * ly + m[4]) * u * dpr, py = (m[1] * lx + m[3] * ly + m[5]) * u * dpr;
    if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
  }
  box.x0 = Math.max(0, Math.floor(x0) - 1); box.y0 = Math.max(0, Math.floor(y0) - 1);
  box.x1 = Math.min(w, Math.ceil(x1) + 1); box.y1 = Math.min(h, Math.ceil(y1) + 1);
  return box;
}

const directRender = pxl.Shape.prototype.render;
pxl.Shape.prototype.render = function(ctx, u, t) {
  const av = this.attributeValues;
  const mode = window.ISO;
  if (mode === 'direct' || this._failedFrame === pxl._frame || av.hidden ||
      (mode !== 'force' && !(hasCompositing(av) && this.hasFill() && this.isStroked()))) {
    return directRender.call(this, ctx, u, t);
  }
  const canvas = ctx.canvas, dpr = this.parentLayer.dpr;
  if (scratch.width < canvas.width || scratch.height < canvas.height) {
    scratch.width = Math.max(scratch.width, canvas.width);
    scratch.height = Math.max(scratch.height, canvas.height);
  }
  let x = 0, y = 0, w = canvas.width, h = canvas.height;
  if (mode === 'bbox') {
    const b = deviceBox(this, u, dpr, canvas.width, canvas.height);
    x = b.x0; y = b.y0; w = b.x1 - b.x0; h = b.y1 - b.y0;
    if (w <= 0 || h <= 0) return;
  }
  sctx.clearRect(x, y, w, h);
  sctx.save();
  try {
    const m = this.getGlobalMatrix();
    sctx.setTransform(m[0] * dpr, m[1] * dpr, m[2] * dpr, m[3] * dpr, m[4] * u * dpr, m[5] * u * dpr);
    this.draw(sctx, u, t);
  } catch (error) {
    this.reportError(error);
  } finally {
    sctx.restore();
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // The compositing part of pxl.applyContextState(), without the transform
  if (av.alpha !== 1) ctx.globalAlpha *= av.alpha;
  if (av.mask !== 'none') ctx.globalCompositeOperation = av.mask;
  else if (av.blend !== 'source-over') ctx.globalCompositeOperation = av.blend;
  if (av.filter !== 'none') ctx.filter = this.resolveFilter(av.filter, u);
  if (av.shadowcolor && av.shadowcolor !== 'none' && av.shadowcolor !== 'transparent') {
    ctx.shadowColor = av.shadowcolor; ctx.shadowBlur = av.shadowblur * u;
    ctx.shadowOffsetX = av.shadowx * u; ctx.shadowOffsetY = av.shadowy * u;
  }
  ctx.drawImage(scratch, x, y, w, h, x, y, w, h);
  ctx.restore();
};

// --- 1. Transform check: forced isolation lands on the same pixels as the direct path ---
function transformCheck() {
  document.getElementById('checkBox').innerHTML = `<pxl-stage ratio="2 / 1" alwaysrender>
    <pxl-layer x="40" y="20" rotate="7" zoom="0.9">
      <pxl-group x="300" y="200" rotate="-20" skewx="15" scalex="1.3" scaley="0.8" dx="10" dy="-5">
        <pxl-group zoom="1.2" rotate="35" x="60">
          <pxl-ellipse rx="90" ry="50" fill="#dbeafe" stroke="#3b82f6" strokewidth="12"></pxl-ellipse>
          <pxl-rect x="150" y="40" w="80" h="50" rotate="10" fill="#fde68a" stroke="#b45309" strokewidth="6"></pxl-rect>
          <pxl-polyline points="-200,80; -120,140; -40,90" stroke="#0f766e" strokewidth="8" arrowend="5"></pxl-polyline>
          <pxl-text x="-60" y="-120" text="'Two\\nlines'" size="40" fill="#111" stroke="#f43f5e" strokewidth="2"></pxl-text>
        </pxl-group>
      </pxl-group>
    </pxl-layer>
  </pxl-stage>`;
  const stage = document.querySelector('#checkBox pxl-stage');
  stage.resize();
  const layer = stage.querySelector('pxl-layer');
  const grab = () => { const c = layer._canvas; return layer._ctx.getImageData(0, 0, c.width, c.height).data; };
  window.ISO = 'direct'; layer.isDirty = true; stage.render(1); const a = grab();
  window.ISO = 'force'; layer.isDirty = true; stage.render(1); const b = grab();
  window.ISO = 'direct';
  let maxDiff = 0, diffPixels = 0;
  for (let i = 0; i < a.length; i += 4) {
    const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]), Math.abs(a[i + 3] - b[i + 3]));
    if (d > maxDiff) maxDiff = d;
    if (d > 2) diffPixels++;
  }
  return { dpr: layer.dpr, pixels: a.length / 4, maxChannelDiff: maxDiff, pixelsDifferingMoreThan2: diffPixels };
}

// --- 2. Cost scene: n animated ellipses with fill, stroke and mask="xor" over a rect (the plan's bench, in the engine) ---
window.buildBench = function(n) {
  let shapes = '';
  for (let i = 0; i < n; i++) {
    shapes += `<pxl-ellipse x="${100 + (i * 37) % 800} + wave(${2 + i % 3}) * 20" y="${100 + (i * 53) % 300}" rx="90" ry="60" ` +
              `fill="#dbeafe" stroke="#3b82f6" strokewidth="8" mask="xor"></pxl-ellipse>`;
  }
  document.getElementById('benchBox').innerHTML = `<pxl-stage ratio="2 / 1"><pxl-layer>
    <pxl-rect x="500" y="250" w="600" h="400" fill="#ffedd5"></pxl-rect>${shapes}</pxl-layer></pxl-stage>`;
};

window.transformResult = transformCheck();
document.getElementById('out').textContent = 'transform check: ' + JSON.stringify(window.transformResult);
</script>
</body>
</html>
