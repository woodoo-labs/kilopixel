<!doctype html>
<html><head><meta charset="utf-8"><script src="/dist/pxl.js"></script><script src="patch.js"></script></head>
<body style="margin:0">
<pxl-stage id="main" ratio="16/9" alwaysrender style="width:1200px"><pxl-layer id="lay"></pxl-layer></pxl-stage>
<script>
// 5,000 circles with fill and stroke: flat, in groups of 50, or in groups nested 3 deep (rotating groups).
// Times Layer.render() (draw phase only) with the old and the patched path, interleaved rounds, medians.
function circle(i) {
  return `<pxl-circle x="${(i * 37) % 1000}" y="${(i * 53) % 560}" r="4" fill="hsl(${i % 360}, 70%, 50%)" stroke="#fff" strokewidth="0.5"></pxl-circle>`;
}
function scene(kind) {
  let html = '';
  if (kind === 'flat') for (let i = 0; i < 5000; i++) html += circle(i);
  if (kind === 'groups') for (let g = 0; g < 100; g++) {
    html += `<pxl-group x="${g % 10}" y="${g % 7}" rotate="sin(t + ${g}) * 2">`;
    for (let i = 0; i < 50; i++) html += circle(g * 50 + i);
    html += '</pxl-group>';
  }
  if (kind === 'nested') for (let a = 0; a < 10; a++) {
    html += `<pxl-group rotate="sin(t + ${a}) * 2">`;
    for (let b = 0; b < 10; b++) {
      html += `<pxl-group x="${b}" rotate="cos(t + ${b}) * 1">`;
      for (let c = 0; c < 5; c++) {
        html += `<pxl-group y="${c}" zoom="1.001">`;
        for (let i = 0; i < 10; i++) html += circle(((a * 10 + b) * 5 + c) * 10 + i);
        html += '</pxl-group>';
      }
      html += '</pxl-group>';
    }
    html += '</pxl-group>';
  }
  return html;
}
window.bench = function(kind, rounds = 15) {
  const stage = document.getElementById('main'), lay = document.getElementById('lay');
  lay.innerHTML = scene(kind);
  stage.resize();
  let t = 1;
  const frame = () => { t += 0.016; pxl._frame++; lay.isDirty = true; lay.update(t); const t0 = performance.now(); lay.render(stage.unit, t); return performance.now() - t0; };
  const oldT = [], newT = [];
  for (let i = 0; i < 5; i++) frame();
  for (let r = 0; r < rounds; r++) {
    oldT.push(frame());
    const un = installTransformPatch(pxl);
    try { newT.push(frame()); } finally { un(); }
  }
  const med = a => a.sort((x, y) => x - y)[a.length >> 1].toFixed(2);
  return `${kind}: old ${med(oldT)} ms, patched ${med(newT)} ms`;
};
</script>
</body></html>
