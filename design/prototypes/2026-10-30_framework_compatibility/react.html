<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kilopixel in React 19</title>
  <script src="/dist/pxl.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 16px; background: #f8fafc; color: #0f172a; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 1200px; }
    .card { background: #fff; border: 1px solid #e2e8f0; padding: 8px; }
    .card h3 { margin: 4px 0 8px; font-size: 14px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; margin-top: 8px; }
    .controls label { display: grid; gap: 2px; }
    .out { font: 12px monospace; white-space: pre-wrap; background: #f1f5f9; padding: 6px; margin-top: 6px; }
    #debug { font: 12px monospace; white-space: pre-wrap; margin-top: 12px; max-width: 1200px; }
  </style>
</head>
<body>
  <h2>Kilopixel in React 19 (prototype)</h2>
  <div id="root"></div>
  <div id="debug"></div>

  <script type="module">
    // Scenarios: two instances (unique ids from useId), numeric binding (r), expression binding that
    // changes per render (moon x, compile cache growth), removeAttribute via undefined (zoom), mount /
    // unmount (moon), Kilopixel onclick string vs. React onClick, reading engine state back.
    import React, { useState, useId } from 'https://esm.sh/react@19.1.0';
    import { createRoot } from 'https://esm.sh/react-dom@19.1.0/client';
    import htm from 'https://esm.sh/htm@3.1.1';
    const html = htm.bind(React.createElement);

    function Planet({ title, hue }) {
      const rawId = useId();
      const id = 'p' + rawId.replace(/[^a-zA-Z0-9]/g, '');
      const [r, setR] = useState(60);
      const [base, setBase] = useState(120);
      const [showMoon, setShowMoon] = useState(true);
      const [big, setBig] = useState(false);
      const [reactClicks, setReactClicks] = useState(0);
      const [readBack, setReadBack] = useState('');

      const read = () => {
        const sun = pxl.nodes[`${id}sun`];
        const attr = document.getElementById(`${id}sun`);
        setReadBack(JSON.stringify({
          rawId, id,
          'sun.r': sun?.r, 'sun.zoom': sun?.zoom, 'sun.isHovered': sun?.isHovered,
          'clicks var': pxl.nodes[`${id}clicks`]?.value,
          'onclick attribute': attr?.getAttribute('onclick'),
          'zoom attribute': attr?.getAttribute('zoom'),
          'moon x attribute': document.getElementById(`${id}moon`)?.getAttribute('x') ?? '(unmounted)'
        }, null, 1));
      };

      return html`
        <div class="card">
          <h3>${title} (id prefix ${id})</h3>
          <pxl-stage id=${`${id}stage`} ratio="2 / 1">
            <pxl-layer>
              <pxl-var id=${`${id}clicks`} value="0"></pxl-var>
              <pxl-circle id=${`${id}sun`} x="500" y="250" r=${r} fill=${`hsl(${hue}, 80, 55)`}
                zoom=${big ? 1.3 : undefined}
                onclick=${`ref.${id}clicks.set('value', ref.${id}clicks.value + 1)`}
                onClick=${() => setReactClicks((c) => c + 1)}></pxl-circle>
              <pxl-group x="500" y="250" rotate="loop(4) * 360">
                ${showMoon && html`<pxl-circle id=${`${id}moon`} x=${`${base} + sin(t / 400) * 20`} r="18" fill="#94a3b8"></pxl-circle>`}
              </pxl-group>
              <pxl-text x="20" y="30" size="16" fill="#0f172a"
                text=${`'clicks (Kilopixel): ' + ref.${id}clicks.value + ' | hovered: ' + ref.${id}sun.isHovered`}></pxl-text>
            </pxl-layer>
          </pxl-stage>
          <div class="controls">
            <label>Sun r (number): ${r}<input type="range" min="20" max="120" value=${r} onInput=${(e) => setR(Number(e.target.value))} /></label>
            <label>Moon orbit (expression): ${base}<input type="range" min="80" max="220" value=${base} onInput=${(e) => setBase(Number(e.target.value))} /></label>
            <label><span><input type="checkbox" checked=${showMoon} onChange=${(e) => setShowMoon(e.target.checked)} /> Moon mounted</span></label>
            <label><span><input type="checkbox" checked=${big} onChange=${(e) => setBig(e.target.checked)} /> zoom 1.3 (else undefined)</span></label>
            <span>React onClick count: ${reactClicks}</span>
            <button onClick=${read}>Read engine state</button>
          </div>
          <div class="out">${readBack}</div>
        </div>`;
    }

    createRoot(document.getElementById('root')).render(html`
      <div class="cards">
        <${Planet} title="Planet A" hue=${200} />
        <${Planet} title="Planet B" hue=${20} />
      </div>`);

    // Engine-side view, outside React
    setInterval(() => {
      document.getElementById('debug').textContent =
        `pxl.nodes: ${Object.keys(pxl.nodes).join(', ')}\n` +
        `animationCache: ${pxl.animationCache.size}   staticCache: ${pxl.staticCache.size}`;
    }, 500);
  </script>
</body>
</html>
