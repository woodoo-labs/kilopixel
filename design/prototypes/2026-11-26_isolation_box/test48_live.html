<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>test48: why it is slow</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #0b0d12; color: #e2e8f0; }
  #bar { position: sticky; top: 0; z-index: 1; display: flex; gap: 22px; align-items: center; padding: 10px 16px;
         background: #1e293b; border-bottom: 1px solid #334155; flex-wrap: wrap; }
  #bar label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #fps { font: 600 18px ui-monospace, monospace; color: #10b981; min-width: 150px; }
  #note { color: #94a3b8; font-size: 13px; }
  iframe { width: 100%; height: calc(100% - 52px); border: 0; display: block; }
</style>
</head>
<body>
<div id="bar">
  <span id="fps">… fps</span>
  <label><input type="checkbox" id="box"> Isolate only the shape's box (prototype, TODO §31)</label>
  <label><input type="checkbox" id="shadows" checked> Shadows</label>
  <span id="note"></span>
</div>
<iframe id="frame" src="/examples/test48.html"></iframe>
<script>
// examples/test48.html as it is, with two switches. The box isolation replaces Shape.prototype.renderIsolated in the
// page's engine with a version that clears, draws and composites only the shape's device box instead of the whole
// layer (the same code as in test48_variants.html next to this file;
// design/done/2026-11-26_isolation_box_plan.md).
const frame = document.getElementById('frame');
let original = null;
const removedShadows = [];

function patchBoxIsolation(pxl) {
  pxl.Shape.prototype.renderIsolated = function(ctx, u) {
    const canvas = ctx.canvas, W = canvas.width, H = canvas.height, k = u * this.parentLayer.dpr;
    const m = this.getGlobalMatrix(), b = this.getHitBox(), pad = this.hitPadding() + 1;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [px, py] of [[b.left - pad, b.top - pad], [b.right + pad, b.top - pad], [b.left - pad, b.bottom + pad], [b.right + pad, b.bottom + pad]]) {
      const dx = (m[0] * px + m[2] * py + m[4]) * k, dy = (m[1] * px + m[3] * py + m[5]) * k;
      if (dx < x0) x0 = dx; if (dx > x1) x1 = dx; if (dy < y0) y0 = dy; if (dy > y1) y1 = dy;
    }
    x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
    x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
    if (!(x1 > x0 && y1 > y0)) return;
    const w = x1 - x0, h = y1 - y0;
    const scratch = pxl.getIsolationContext(W, H);
    scratch.clearRect(0, 0, w, h);
    scratch.save();
    try {
      scratch.setTransform(m[0] * k, m[1] * k, m[2] * k, m[3] * k, m[4] * k - x0, m[5] * k - y0);
      this.draw(scratch);
    } catch (error) { this.reportError(error); return; } finally { scratch.restore(); }
    ctx.save();
    try {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      pxl.applyCompositingState(ctx, u, this.values, this);
      ctx.drawImage(scratch.canvas, 0, 0, w, h, x0, y0, w, h);
    } catch (error) { this.reportError(error); } finally { ctx.restore(); }
  };
}

frame.addEventListener('load', () => {
  const w = frame.contentWindow, stage = w.document.querySelector('pxl-stage');
  original = w.pxl.Shape.prototype.renderIsolated;
  document.getElementById('note').textContent =
    `stage ${stage.clientWidth} × ${stage.clientHeight} CSS px, device pixel ratio ${w.devicePixelRatio}`;
  setInterval(() => { document.getElementById('fps').textContent = `${stage.values.fps} fps, ${stage.values.renderAvg} ms`; }, 500);

  document.getElementById('box').onchange = (e) => {
    if (e.target.checked) patchBoxIsolation(w.pxl);
    else w.pxl.Shape.prototype.renderIsolated = original;
  };
  document.getElementById('shadows').onchange = (e) => {
    if (!e.target.checked) {
      for (const el of w.document.querySelectorAll('[shadowcolor]')) {
        removedShadows.push([el, el.getAttribute('shadowcolor')]);
        el.removeAttribute('shadowcolor');
      }
    } else {
      for (const [el, value] of removedShadows.splice(0)) el.setAttribute('shadowcolor', value);
    }
  };
});
</script>
</body>
</html>
