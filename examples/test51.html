<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open vs Closed Chords</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #111; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh;
      padding: 24px;
      color: white;
      font-family: sans-serif;
    }
    .stage-wrapper {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 2 / 1;
      background: #000;
      position: relative;
    }
    pxl-stage {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="../dist/pxl.min.js"></script>
</head>
<body>
  <div class="stage-wrapper">
    <pxl-stage id="main" ratio="2 / 1">
      <pxl-layer>
        <pxl-grid step="50" stroke="#333" strokewidth="1"></pxl-grid>

        <!-- Open Chord (Default) -->
        <pxl-circle 
          x="300" y="250" 
          r="150" 
          start="180"
          sweep="180"
          fill="rgba(255, 50, 50, 0.3)" 
          stroke="#ff3232" 
          strokewidth="10">
        </pxl-circle>
        
        <pxl-text x="300" y="300" text="Open Arc (Default)" align="center" fill="white" size="20"></pxl-text>
        
        <!-- Closed Chord -->
        <pxl-circle 
          x="700" y="250" 
          r="150"
          start="180" 
          sweep="180"
          closed="true"
          fill="rgba(50, 150, 255, 0.3)" 
          stroke="#3296ff" 
          strokewidth="10">
        </pxl-circle>

        <pxl-text x="700" y="300" text="Closed Chord (closed='true')" align="center" fill="white" size="20"></pxl-text>

      </pxl-layer>
    </pxl-stage>
  </div>
</body>
</html>
