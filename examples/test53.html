<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Layer Spaces</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8fafc;
      color: #0f172a;
      font-family: sans-serif;
      padding: 24px;
    }
    .stage-wrapper {
      width: 1200px;
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e2e8f0;
    }
    .controls {
      width: 1200px;
      max-width: 100%;
      margin: 16px auto 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .control-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #e2e8f0;
      align-content: start;
    }
    .control-column h3 { font-size: 14px; grid-column: 1 / -1; }
    /* Label text and value on one line, slider below */
    .control-column label { display: grid; grid-template-columns: auto 1fr; gap: 4px 6px; font-size: 13px; }
    .control-column label span { text-align: right; }
    .control-column input { width: 100%; grid-column: 1 / -1; }
    .control-column .full-row { grid-column: 1 / -1; }
    .control-column select { width: 100%; grid-column: 1 / -1; font-size: 13px; }
    .layer1 h3 { color: #ea580c; }
    .layer2 h3 { color: #2563eb; }
    .layer3 h3 { color: #16a34a; }
    .layer4 h3 { color: #7c3aed; }
    /* Card titles have the color of what they control on the stage:
       layer cards the layer center (600), rect cards the rect stroke (500) */
    .rect.layer1 h3 { color: #f97316; }
    .rect.layer2 h3 { color: #3b82f6; }
    .rect.layer3 h3 { color: #22c55e; }
    .rect.layer4 h3 { color: #8b5cf6; }
  </style>
  <script src="../dist/pxl.min.js"></script>
</head>
<body>
  <div class="stage-wrapper">
    <pxl-stage id="main" ratio="5 / 3">
      <!-- Background grid in stage space -->
      <pxl-layer>
        <pxl-grid stroke="#f1f5f9" step="25" major="4"></pxl-grid>
      </pxl-layer>

      <!-- Layer 1 (orange) -->
      <pxl-layer id="layer1" x="250" y="150">
        <!-- The group cancels the layer's offset, so the markers stay on the layer's x / y -->
        <pxl-group dx="-ref.layer1.dx" dy="-ref.layer1.dy">
          <pxl-line x1="0" y1="-2000" x2="0" y2="2000" stroke="#fdba74" strokewidth="1" linedash="[5, 5]"></pxl-line>
          <pxl-line x1="-2000" y1="0" x2="2000" y2="0" stroke="#fdba74" strokewidth="1" linedash="[5, 5]"></pxl-line>
          <pxl-circle r="4" fill="#ea580c"></pxl-circle>
          <pxl-text x="8" y="-8" text="Layer 1 Center" size="14" fill="#ea580c"></pxl-text>
        </pxl-group>
        <pxl-rect id="rect1" x="-75" y="-50" w="100" h="50" fill="#ffedd566" stroke="#f97316" strokewidth="2"></pxl-rect>
        <pxl-circle x="ref.rect1.x" y="ref.rect1.y" r="3" fill="#fb923c"></pxl-circle>
        <!-- Top-left corner of rect1: same transform, offset by the anchor-to-corner vector -->
        <pxl-circle id="corner1" x="ref.rect1.x" y="ref.rect1.y" rotate="ref.rect1.rotate"
          scale="ref.rect1.scale" scalex="ref.rect1.scalex" scaley="ref.rect1.scaley" skewx="ref.rect1.skewx" skewy="ref.rect1.skewy"
          dx="ref.rect1.dx - ref.rect1.w * pxl.anchorX[ref.rect1.anchor]" dy="ref.rect1.dy - ref.rect1.h * pxl.anchorY[ref.rect1.anchor]"
          r="3" fill="#eab308"></pxl-circle>
      </pxl-layer>

      <!-- Layer 2 (blue) -->
      <pxl-layer id="layer2" x="750" y="150">
        <!-- The group cancels the layer's offset, so the markers stay on the layer's x / y -->
        <pxl-group dx="-ref.layer2.dx" dy="-ref.layer2.dy">
          <pxl-line x1="0" y1="-2000" x2="0" y2="2000" stroke="#93c5fd" strokewidth="1" linedash="[5, 5]"></pxl-line>
          <pxl-line x1="-2000" y1="0" x2="2000" y2="0" stroke="#93c5fd" strokewidth="1" linedash="[5, 5]"></pxl-line>
          <pxl-circle r="4" fill="#2563eb"></pxl-circle>
          <pxl-text x="8" y="-8" text="Layer 2 Center" size="14" fill="#2563eb"></pxl-text>
        </pxl-group>
        <pxl-rect id="rect2" x="-75" y="-50" w="100" h="50" fill="#dbeafe66" stroke="#3b82f6" strokewidth="2"></pxl-rect>
        <pxl-circle x="ref.rect2.x" y="ref.rect2.y" r="3" fill="#60a5fa"></pxl-circle>
        <!-- Top-left corner of rect2: same transform, offset by the anchor-to-corner vector -->
        <pxl-circle id="corner2" x="ref.rect2.x" y="ref.rect2.y" rotate="ref.rect2.rotate"
          scale="ref.rect2.scale" scalex="ref.rect2.scalex" scaley="ref.rect2.scaley" skewx="ref.rect2.skewx" skewy="ref.rect2.skewy"
          dx="ref.rect2.dx - ref.rect2.w * pxl.anchorX[ref.rect2.anchor]" dy="ref.rect2.dy - ref.rect2.h * pxl.anchorY[ref.rect2.anchor]"
          r="3" fill="#eab308"></pxl-circle>
      </pxl-layer>

      <!-- Layer 3 (green) -->
      <pxl-layer id="layer3" x="250" y="450">
        <!-- The group cancels the layer's offset, so the markers stay on the layer's x / y -->
        <pxl-group dx="-ref.layer3.dx" dy="-ref.layer3.dy">
          <pxl-line x1="0" y1="-2000" x2="0" y2="2000" stroke="#86efac" strokewidth="1" linedash="[5, 5]"></pxl-line>
          <pxl-line x1="-2000" y1="0" x2="2000" y2="0" stroke="#86efac" strokewidth="1" linedash="[5, 5]"></pxl-line>
          <pxl-circle r="4" fill="#16a34a"></pxl-circle>
          <pxl-text x="8" y="-8" text="Layer 3 Center" size="14" fill="#16a34a"></pxl-text>
        </pxl-group>
        <pxl-rect id="rect3" x="-75" y="-50" w="100" h="50" fill="#dcfce766" stroke="#22c55e" strokewidth="2"></pxl-rect>
        <pxl-circle x="ref.rect3.x" y="ref.rect3.y" r="3" fill="#4ade80"></pxl-circle>
        <!-- Top-left corner of rect3: same transform, offset by the anchor-to-corner vector -->
        <pxl-circle id="corner3" x="ref.rect3.x" y="ref.rect3.y" rotate="ref.rect3.rotate"
          scale="ref.rect3.scale" scalex="ref.rect3.scalex" scaley="ref.rect3.scaley" skewx="ref.rect3.skewx" skewy="ref.rect3.skewy"
          dx="ref.rect3.dx - ref.rect3.w * pxl.anchorX[ref.rect3.anchor]" dy="ref.rect3.dy - ref.rect3.h * pxl.anchorY[ref.rect3.anchor]"
          r="3" fill="#eab308"></pxl-circle>
      </pxl-layer>

      <!-- Layer 4 (violet) -->
      <pxl-layer id="layer4" x="750" y="450">
        <!-- The group cancels the layer's offset, so the markers stay on the layer's x / y -->
        <pxl-group dx="-ref.layer4.dx" dy="-ref.layer4.dy">
          <pxl-line x1="0" y1="-2000" x2="0" y2="2000" stroke="#c4b5fd" strokewidth="1" linedash="[5, 5]"></pxl-line>
          <pxl-line x1="-2000" y1="0" x2="2000" y2="0" stroke="#c4b5fd" strokewidth="1" linedash="[5, 5]"></pxl-line>
          <pxl-circle r="4" fill="#7c3aed"></pxl-circle>
          <pxl-text x="8" y="-8" text="Layer 4 Center" size="14" fill="#7c3aed"></pxl-text>
        </pxl-group>
        <pxl-rect id="rect4" x="-75" y="-50" w="100" h="50" fill="#ede9fe66" stroke="#8b5cf6" strokewidth="2"></pxl-rect>
        <pxl-circle x="ref.rect4.x" y="ref.rect4.y" r="3" fill="#a78bfa"></pxl-circle>
        <!-- Top-left corner of rect4: same transform, offset by the anchor-to-corner vector -->
        <pxl-circle id="corner4" x="ref.rect4.x" y="ref.rect4.y" rotate="ref.rect4.rotate"
          scale="ref.rect4.scale" scalex="ref.rect4.scalex" scaley="ref.rect4.scaley" skewx="ref.rect4.skewx" skewy="ref.rect4.skewy"
          dx="ref.rect4.dx - ref.rect4.w * pxl.anchorX[ref.rect4.anchor]" dy="ref.rect4.dy - ref.rect4.h * pxl.anchorY[ref.rect4.anchor]"
          r="3" fill="#eab308"></pxl-circle>
      </pxl-layer>
      <!-- Connector: the rect centers mapped from their layers into this untransformed layer.
           Drawn last, so it reads the rects after they moved in the same frame. -->
      <pxl-layer>
        <pxl-polyline closed="true" stroke="#ec4899" strokewidth="1" linedash="[10, 10]"
          points="toLocal(ref.rect1, 'x'), toLocal(ref.rect1, 'y');
                  toLocal(ref.rect2, 'x'), toLocal(ref.rect2, 'y');
                  toLocal(ref.rect4, 'x'), toLocal(ref.rect4, 'y');
                  toLocal(ref.rect3, 'x'), toLocal(ref.rect3, 'y')">
        </pxl-polyline>
        <!-- The drawing origins (x + dx, y + dy, the offset turned by the rect's own transform) -->
        <pxl-polyline closed="true" stroke="#06b6d4" strokewidth="1" linedash="[10, 10]"
          points="toLocal(ref.rect1, 'x') + toLocal(ref.rect1, 'dx'), toLocal(ref.rect1, 'y') + toLocal(ref.rect1, 'dy');
                  toLocal(ref.rect2, 'x') + toLocal(ref.rect2, 'dx'), toLocal(ref.rect2, 'y') + toLocal(ref.rect2, 'dy');
                  toLocal(ref.rect4, 'x') + toLocal(ref.rect4, 'dx'), toLocal(ref.rect4, 'y') + toLocal(ref.rect4, 'dy');
                  toLocal(ref.rect3, 'x') + toLocal(ref.rect3, 'dx'), toLocal(ref.rect3, 'y') + toLocal(ref.rect3, 'dy')">
        </pxl-polyline>
        <!-- The top-left corners, read from the corner markers -->
        <pxl-polyline closed="true" stroke="#eab308" strokewidth="1" linedash="[10, 10]"
          points="toLocal(ref.corner1, 'tx'), toLocal(ref.corner1, 'ty');
                  toLocal(ref.corner2, 'tx'), toLocal(ref.corner2, 'ty');
                  toLocal(ref.corner4, 'tx'), toLocal(ref.corner4, 'ty');
                  toLocal(ref.corner3, 'tx'), toLocal(ref.corner3, 'ty')">
        </pxl-polyline>
      </pxl-layer>
    </pxl-stage>
  </div>

    <div class="control-column layer1">
      <h3>Layer 1</h3>
      <label>Center X <span id="layer1XVal">250</span>
        <input type="range" min="0" max="1000" step="25" value="250" autocomplete="off"
          oninput="document.getElementById('layer1').setAttribute('x', this.value); document.getElementById('layer1XVal').innerText = this.value;">
      </label>
      <label>Center Y <span id="layer1YVal">150</span>
