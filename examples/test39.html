<html lang="en">

  <title>Test 39 - Moiré Effect Concentric Squares & 2-Layer Performance Architecture</title>

      padding: 30px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #f8fafc;
      margin: 0 0 8px 0;
      font-size: 24px;
      letter-spacing: 1px;
    }
    .header p {
      margin: 0;
      font-size: 14px;
      color: #64748b;
    }
    .stage-container {
      width: min(90vw, 90vh);

    <h1>KILOPIXEL MOIRÉ EFFECT — CONCENTRIC SQUARES</h1>
    <p>Hardware GPU-Composited 2-Layer Architecture (Static Background Canvas + Animated Rotating Foreground Canvas)</p>
  </div>

      </pxl-layer>

      <!-- ========================================================================= -->
      <!-- LAYER 3: HUD TELEMETRY -->
      <!-- Angle readout on top-left and FPS/Render performance monitor on top-right -->
      <!-- ========================================================================= -->
      <pxl-layer id="hudLayer">
        <pxl-text 
          x="20" y="30" 
          text="'ANGLE: ' + Math.round((ref.spinner?.rotate || 0) % 360) + '°'" 
          font="monospace"
          size="14" 
          fill="#0f0" 
          align="left"
          stroke="none"></pxl-text>

        <pxl-text 
          x="980" y="30" 
          text="ref.main.fps + ' FPS | AVG: ' + ref.main.renderAvg + 'ms'" 
          font="monospace" 
          size="14" 
          fill="#0f0" 
          align="right" 
          stroke="none"></pxl-text>
      </pxl-layer>
