<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilopixel — Interactive Pursuit Curve Vortex</title>
  <script src="../dist/pxl.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0d0e15;
      color: #fff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00e5ff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: #8c92b3;
      max-width: 650px;
      line-height: 1.5;
    }
    .stage-container {
      width: 100%;
      max-width: min(90vw, 82vh);
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 229, 255, 0.1);
      overflow: hidden;
      background: #000;
      margin-bottom: 30px;
    }
    pxl-stage {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls-panel {
      width: 100%;
      max-width: min(90vw, 82vh);
      padding: 24px 28px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: #b4b8cc;
      letter-spacing: 0.5px;
    }
    .control-label span {
      color: #00e5ff;
      font-family: monospace;
      font-size: 14px;
      font-weight: 600;
      background: rgba(0, 229, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background: #fff;
    }
  </style>
</head>

  <div class="controls-panel">
    <div class="control-group">
      <div class="control-label">
        <span>RADIUS (R)</span>
        <span id="valR">460</span>
      </div>
      <input type="range" min="200" max="500" step="10" value="460" autocomplete="off" 
             oninput="document.getElementById('R').setAttribute('value', this.value); document.getElementById('valR').textContent = this.value;">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>LINE WIDTH</span>
        <span id="valLineW">1.6px</span>
      </div>
      <input type="range" min="0.5" max="5.0" step="0.1" value="1.6" autocomplete="off" 
             oninput="document.getElementById('lineW').setAttribute('value', this.value); document.getElementById('valLineW').textContent = this.value + 'px';">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>ROTATION SPEED</span>
        <span id="valSpeed">24°/s</span>
      </div>
      <input type="range" min="-60" max="60" step="1" value="24" autocomplete="off" 
             oninput="document.getElementById('rotSpeed').setAttribute('value', this.value); document.getElementById('valSpeed').textContent = this.value + '°/s';">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>STEP ANGLE</span>
        <span id="valStep">2.0°</span>
      </div>
      <input type="range" min="0.5" max="5.0" step="0.1" value="2.0" autocomplete="off" 
             oninput="document.getElementById('stepAng').setAttribute('value', this.value); document.getElementById('valStep').textContent = this.value + '°';">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>SPIRAL DECAY</span>
        <span id="valDecay">0.9436</span>
      </div>
      <input type="range" min="0.8800" max="0.9800" step="0.0020" value="0.9436" autocomplete="off" 
             oninput="document.getElementById('decay').setAttribute('value', this.value); document.getElementById('valDecay').textContent = Number(this.value).toFixed(4);">
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>CLIP RADIUS</span>
        <span id="valClip">230</span>
      </div>
      <input type="range" min="50" max="460" step="5" value="230" autocomplete="off" 
             oninput="document.getElementById('clipR').setAttribute('value', this.value); document.getElementById('valClip').textContent = this.value;">
    </div>
  </div>
