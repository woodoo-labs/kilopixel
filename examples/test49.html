<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olafur Eliasson - Colour Experiment</title>
  
  <!-- Load Kilopixel Engine -->
  <script src="../dist/pxl.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      background: #e2e8f0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      font-family: sans-serif;
    }
    
    .stage-wrapper {
      width: 85vmin;
      height: 85vmin;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    pxl-stage {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <!-- ratio="1 / 1" sets the logical drawing canvas to 1000x1000 square -->
    <pxl-stage id="stage" ratio="1 / 1">
      <!-- By placing x=500 y=500 on the layer, the entire local coordinate system is centered! -->
      <!-- FAST-PATH ANIMATION: hueRotate triggers the CSS-only fast path, meaning the CPU draws the 36 circles ONCE, and the GPU shifts the colors at 60 FPS for free! -->
      <pxl-layer x="500" y="500" filter="hueRotate(t * 30)">
        
        <!-- Crucial: We must fill the canvas with white FIRST, or multiply blending against a transparent canvas will fail to render! -->
        <pxl-rect w="1000" h="1000" fill="#ffffff"></pxl-rect>
        
      <pxl-circle rotate="0" dx="140" r="280" fill="hsla(0, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="10" dx="140" r="280" fill="hsla(10, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="20" dx="140" r="280" fill="hsla(20, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="30" dx="140" r="280" fill="hsla(30, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="40" dx="140" r="280" fill="hsla(40, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="50" dx="140" r="280" fill="hsla(50, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="60" dx="140" r="280" fill="hsla(60, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="70" dx="140" r="280" fill="hsla(70, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="80" dx="140" r="280" fill="hsla(80, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="90" dx="140" r="280" fill="hsla(90, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="100" dx="140" r="280" fill="hsla(100, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="110" dx="140" r="280" fill="hsla(110, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="120" dx="140" r="280" fill="hsla(120, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="130" dx="140" r="280" fill="hsla(130, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="140" dx="140" r="280" fill="hsla(140, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="150" dx="140" r="280" fill="hsla(150, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="160" dx="140" r="280" fill="hsla(160, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="170" dx="140" r="280" fill="hsla(170, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="180" dx="140" r="280" fill="hsla(180, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="190" dx="140" r="280" fill="hsla(190, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="200" dx="140" r="280" fill="hsla(200, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="210" dx="140" r="280" fill="hsla(210, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="220" dx="140" r="280" fill="hsla(220, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="230" dx="140" r="280" fill="hsla(230, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="240" dx="140" r="280" fill="hsla(240, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="250" dx="140" r="280" fill="hsla(250, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="260" dx="140" r="280" fill="hsla(260, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="270" dx="140" r="280" fill="hsla(270, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="280" dx="140" r="280" fill="hsla(280, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="290" dx="140" r="280" fill="hsla(290, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="300" dx="140" r="280" fill="hsla(300, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="310" dx="140" r="280" fill="hsla(310, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="320" dx="140" r="280" fill="hsla(320, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="330" dx="140" r="280" fill="hsla(330, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="340" dx="140" r="280" fill="hsla(340, 100, 65, 0.18)" blend="screen"></pxl-circle>
      <pxl-circle rotate="350" dx="140" r="280" fill="hsla(350, 100, 65, 0.18)" blend="screen"></pxl-circle>
      
      </pxl-layer>
      
      <!-- UI Layer (Static, non-rotating) -->
      <pxl-layer>
        <!-- Placed at bottom-center (x=500, y=940) so it is not clipped by the circular CSS overflow -->
        <pxl-text x="500" y="940" text="ref.stage.fps + ' FPS | ' + ref.stage.renderAvg + 'ms'" font="monospace" size="13" align="center" fill="#94a3b8"></pxl-text>
      </pxl-layer>
    </pxl-stage>
  </div>

</body>
</html>
