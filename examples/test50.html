<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Victor Vasarely — Vega Spherical Deformation — Kilopixel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="../dist/pxl.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      min-height: 100vh;
      background: #040407;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .header-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }

    .title-group p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .meta-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 10px;
      border-radius: 9999px;
    }

    /* 1:1 Showcase Stage Container copied from test48.html */
    .stage-wrapper {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 1 / 1;
      background: #030305;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 1px 1px rgba(255, 255, 255, 0.05);
      position: relative;
    }

    pxl-stage {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-group">
      <h1>Victor Vasarely — Vega Spherical Deformation</h1>
      <p>Kinetic Op-Art, geometric lens curvature &amp; rhythmic breathing</p>
    </div>
    <div class="meta-tag">STAGE 1:1 &bull; 1000&times;1000</div>
  </div>

  <div class="stage-wrapper">
    <pxl-stage id="stage" ratio="1 / 1">

      <!-- ================================================================= -->
      <!-- LAYER 1: UNDISTORTED EXTERIOR GRID                                -->
      <!-- ================================================================= -->
      <pxl-layer x="500" y="500">
        <pxl-grid step="50" stroke="#334155" strokewidth="2"></pxl-grid>
      </pxl-layer>

      <!-- ================================================================= -->
      <!-- LAYER 2: 3D SPHERICAL BULGE                                       -->
      <!-- ================================================================= -->
      <pxl-layer x="500" y="500">
        <!-- 
          SPHERICAL DEFORMATION LINES (Catmull-Rom smoothed polylines):
          The midpoint bows outward proportionally to create the 3D optical sphere.
          wave(3.5) modulates the bulging amplitude so the sphere rhythmically breathes!
        -->

        <!-- Vertical Longitude Arcs (Bowing Left & Right) -->
        <pxl-line x1="-450" y1="-500" x2="-450" y2="500" stroke="#0369a1" strokewidth="3"></pxl-line>
        <pxl-polyline smooth="1" points="-400,-500; -400 - wave(3.5)*40,0; -400,500" stroke="#0284c7" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-350,-500; -350 - wave(3.5)*80,0; -350,500" stroke="#0ea5e9" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-300,-500; -300 - wave(3.5)*125,0; -300,500" stroke="#38bdf8" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-250,-500; -250 - wave(3.5)*160,0; -250,500" stroke="#38bdf8" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-200,-500; -200 - wave(3.5)*185,0; -200,500" stroke="#7dd3fc" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-150,-500; -150 - wave(3.5)*170,0; -150,500" stroke="#a5f3fc" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-100,-500; -100 - wave(3.5)*130,0; -100,500" stroke="#e0f2fe" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-50,-500;  -50  - wave(3.5)*65,0;  -50,500"  stroke="#ffffff" strokewidth="3" fill="none"></pxl-polyline>

        <!-- Central Meridian (Straight axis) -->
        <pxl-line x1="0" y1="-500" x2="0" y2="500" stroke="#ffffff" strokewidth="3.5"></pxl-line>

        <pxl-polyline smooth="1" points="50,-500;   50   + wave(3.5)*65,0;   50,500"   stroke="#ffffff" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="100,-500;  100  + wave(3.5)*130,0;  100,500"  stroke="#e0f2fe" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="150,-500;  150  + wave(3.5)*170,0;  150,500"  stroke="#a5f3fc" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="200,-500;  200  + wave(3.5)*185,0;  200,500"  stroke="#7dd3fc" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="250,-500;  250  + wave(3.5)*160,0;  250,500"  stroke="#38bdf8" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="300,-500;  300  + wave(3.5)*125,0;  300,500"  stroke="#38bdf8" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="350,-500;  350  + wave(3.5)*80,0;   350,500"  stroke="#0ea5e9" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="400,-500;  400  + wave(3.5)*40,0;   400,500"  stroke="#0284c7" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-line x1="450" y1="-500" x2="450" y2="500" stroke="#0369a1" strokewidth="3"></pxl-line>


        <!-- Horizontal Latitude Arcs (Bowing Up & Down) -->
        <pxl-line x1="-500" y1="-450" x2="500" y2="-450" stroke="#0369a1" strokewidth="3"></pxl-line>
        <pxl-polyline smooth="1" points="-500,-400; 0,-400 - wave(3.5)*40;  500,-400" stroke="#0284c7" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,-350; 0,-350 - wave(3.5)*80;  500,-350" stroke="#0ea5e9" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,-300; 0,-300 - wave(3.5)*125; 500,-300" stroke="#38bdf8" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,-250; 0,-250 - wave(3.5)*160; 500,-250" stroke="#38bdf8" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,-200; 0,-200 - wave(3.5)*185; 500,-200" stroke="#7dd3fc" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,-150; 0,-150 - wave(3.5)*170; 500,-150" stroke="#a5f3fc" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,-100; 0,-100 - wave(3.5)*130; 500,-100" stroke="#e0f2fe" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,-50;  0,-50  - wave(3.5)*65;  500,-50"  stroke="#ffffff" strokewidth="3" fill="none"></pxl-polyline>

        <!-- Central Equator (Straight axis) -->
        <pxl-line x1="-500" y1="0" x2="500" y2="0" stroke="#ffffff" strokewidth="3.5"></pxl-line>

        <pxl-polyline smooth="1" points="-500,50;   0,50   + wave(3.5)*65;  500,50"   stroke="#ffffff" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,100;  0,100  + wave(3.5)*130; 500,100"  stroke="#e0f2fe" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,150;  0,150  + wave(3.5)*170; 500,150"  stroke="#a5f3fc" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,200;  0,200  + wave(3.5)*185; 500,200"  stroke="#7dd3fc" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,250;  0,250  + wave(3.5)*160; 500,250"  stroke="#38bdf8" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,300;  0,300  + wave(3.5)*125; 500,300"  stroke="#38bdf8" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,350;  0,350  + wave(3.5)*80;  500,350"  stroke="#0ea5e9" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-polyline smooth="1" points="-500,400;  0,400  + wave(3.5)*40;  500,400"  stroke="#0284c7" strokewidth="3" fill="none"></pxl-polyline>
        <pxl-line x1="-500" y1="450" x2="500" y2="450" stroke="#0369a1" strokewidth="3"></pxl-line>
      </pxl-layer>

      <!-- ================================================================= -->
      <!-- LAYER 3: PERFORMANCE TELEMETRY                                    -->
      <!-- ================================================================= -->
      <pxl-layer>
        <pxl-text x="968" y="42" text="ref.stage.fps + ' FPS | ' + ref.stage.renderAvg + 'ms'" font="monospace" size="13" align="right" fill="#10b981"></pxl-text>
      </pxl-layer>

    </pxl-stage>
  </div>

</body>
</html>
