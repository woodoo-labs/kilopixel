<!DOCTYPE html>
<html>
<head>
  <title>Radial Gradient Spotlight Visual</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
    canvas { background: white; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 2rem; }
    .controls { display: flex; gap: 2rem; background: white; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; }
    .slider-group { display: flex; flex-direction: column; gap: 0.5rem; }
  </style>
</head>
<body>
  <h2>HTML5 Canvas: 6-Argument Radial Gradient (Spotlight)</h2>
  <p>This demonstrates how moving the <strong>Start Circle</strong> away from the <strong>End Circle</strong> creates a 3D cone.</p>

  <canvas id="canvas" width="600" height="400"></canvas>

  <div class="controls">
    <div class="slider-group">
      <strong>Start Circle (Inner)</strong>
      <label>X0: <input type="range" id="x0" min="0" max="600" value="150"></label>
      <label>Y0: <input type="range" id="y0" min="0" max="400" value="150"></label>
      <label>R0: <input type="range" id="r0" min="0" max="200" value="20"></label>
    </div>
    <div class="slider-group">
      <strong>End Circle (Outer)</strong>
      <label>X1: <input type="range" id="x1" min="0" max="600" value="300"></label>
      <label>Y1: <input type="range" id="y1" min="0" max="400" value="200"></label>
      <label>R1: <input type="range" id="r1" min="0" max="400" value="180"></label>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const inputs = ['x0', 'y0', 'r0', 'x1', 'y1', 'r1'].map(id => document.getElementById(id));

    function draw() {
      const [x0, y0, r0, x1, y1, r1] = inputs.map(i => parseFloat(i.value));

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw the actual gradient filling the background
      const grad = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
      grad.addColorStop(0, 'rgba(139, 92, 246, 1)');   // Purple
      grad.addColorStop(1, 'rgba(139, 92, 246, 0)');   // Transparent
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Visualize the Start Circle (Red)
      ctx.beginPath();
      ctx.arc(x0, y0, r0, 0, Math.PI * 2);
      ctx.strokeStyle = 'red';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // 3. Visualize the End Circle (Blue)
      ctx.beginPath();
      ctx.arc(x1, y1, r1, 0, Math.PI * 2);
      ctx.strokeStyle = 'blue';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 4. Draw connecting lines to visualize the cone
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    inputs.forEach(i => i.addEventListener('input', draw));
    draw();
  </script>
</body>
</html>
